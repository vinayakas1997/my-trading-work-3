services:
  # =========================================================================
  # vinu-news Services (Ports: 8080)
  # =========================================================================
  news-ingest:
    build:
      context: ./vinu-news
      dockerfile: Dockerfile
    command: ["vinu-news-ingest", "--continuous"]
    env_file: ./vinu-news/.env
    environment:
      VINU_NEWS_DB_PATH: /data/news.db
      VINU_NEWS_STORAGE: sqlite
      VINU_SHARED_WATCHLIST_PATH: /shared/watchlist.json
      VINU_LLM_ANALYSIS_MODE: manual
    volumes:
      - ./integration_test_data/news:/data
      - ./integration_test_data/shared:/shared
    restart: unless-stopped

  news-api:
    build:
      context: ./vinu-news
      dockerfile: Dockerfile
    command: ["vinu-news-serve", "--host", "0.0.0.0", "--port", "8080"]
    env_file: ./vinu-news/.env
    environment:
      VINU_NEWS_DB_PATH: /data/news.db
      VINU_NEWS_STORAGE: sqlite
      VINU_SHARED_WATCHLIST_PATH: /shared/watchlist.json
      VINU_LLM_ANALYSIS_MODE: manual
    ports:
      - "8080:8080"
    volumes:
      - ./integration_test_data/news:/data
      - ./integration_test_data/shared:/shared
    restart: unless-stopped
    depends_on:
      - news-ingest

  # =========================================================================
  # vinu-stock-price Services (Ports: 8081)
  # =========================================================================
  stock-ingest:
    build:
      context: ./vinu-stock-price
      dockerfile: Dockerfile
    command: ["vinu-stock-ingest", "--interval", "60"]
    env_file: ./vinu-stock-price/.env
    environment:
      VINU_STOCK_DATA_ROOT: /data
      VINU_STOCK_META_DB_PATH: /data/meta.db
      VINU_SHARED_WATCHLIST_PATH: /shared/watchlist.json
    volumes:
      - ./integration_test_data/stock:/data
      - ./integration_test_data/shared:/shared
    restart: unless-stopped

  stock-api:
    build:
      context: ./vinu-stock-price
      dockerfile: Dockerfile
    command: ["vinu-stock-serve", "--host", "0.0.0.0", "--port", "8081"]
    env_file: ./vinu-stock-price/.env
    environment:
      VINU_STOCK_DATA_ROOT: /data
      VINU_STOCK_META_DB_PATH: /data/meta.db
      VINU_SHARED_WATCHLIST_PATH: /shared/watchlist.json
    ports:
      - "8081:8081"
    volumes:
      - ./integration_test_data/stock:/data
      - ./integration_test_data/shared:/shared
    restart: unless-stopped
    depends_on:
      - stock-ingest

  # =========================================================================
  # vinu-features Services (Ports: 8082)
  # =========================================================================
  features-worker:
    build:
      context: ./vinu-features
      dockerfile: Dockerfile
    command: ["vinu-features", "worker", "--loop"]
    env_file: ./vinu-features/.env
    environment:
      VINU_FEATURES_DATA_DIR: /data
      VINU_FEATURES_META_DB_PATH: /data/meta.db
      VINU_STOCK_API_URL: http://stock-api:8081
    volumes:
      - ./integration_test_data/features:/data
    restart: unless-stopped

  features-api:
    build:
      context: ./vinu-features
      dockerfile: Dockerfile
    command: ["vinu-features", "serve", "--host", "0.0.0.0", "--port", "8082"]
    env_file: ./vinu-features/.env
    environment:
      VINU_FEATURES_DATA_DIR: /data
      VINU_FEATURES_META_DB_PATH: /data/meta.db
      VINU_STOCK_API_URL: http://stock-api:8081
    ports:
      - "8082:8082"
    volumes:
      - ./integration_test_data/features:/data
    restart: unless-stopped
    depends_on:
      - features-worker
      - stock-api

  # =========================================================================
  # vinu-correlation Services (Ports: 8083)
  # =========================================================================
  correlation-compute:
    build:
      context: ./vinu-correlation
      dockerfile: Dockerfile
    command: ["vinu-correlation-compute", "--continuous", "--incremental"]
    env_file: ./vinu-correlation/.env
    environment:
      VINU_CORRELATION_DATA_ROOT: /data
      VINU_NEWS_API_URL: http://news-api:8080
      VINU_STOCK_API_URL: http://stock-api:8081
      VINU_CORRELATION_MARKET_HOURS_ONLY: "true"
    volumes:
      - ./integration_test_data/correlation:/data
    restart: unless-stopped
    depends_on:
      - news-api
      - stock-api

  correlation-api:
    build:
      context: ./vinu-correlation
      dockerfile: Dockerfile
    command: ["vinu-correlation-serve", "--host", "0.0.0.0", "--port", "8083"]
    env_file: ./vinu-correlation/.env
    environment:
      VINU_CORRELATION_DATA_ROOT: /data
      VINU_NEWS_API_URL: http://news-api:8080
      VINU_STOCK_API_URL: http://stock-api:8081
    ports:
      - "8083:8083"
    volumes:
      - ./integration_test_data/correlation:/data
    restart: unless-stopped
    depends_on:
      - correlation-compute

  # =========================================================================
  # vinu-strategy Services (Ports: 8084)
  # =========================================================================
  strategy-api:
    build:
      context: ./vinu-strategy
      dockerfile: Dockerfile
    command: ["vinu-strategy", "serve", "--host", "0.0.0.0", "--port", "8084"]
    env_file: ./vinu-strategy/.env
    environment:
      VINU_STRATEGY_DATA_ROOT: /data
      VINU_STRATEGY_STRATEGIES_DIR: /app/vinu-strategy/strategies
      VINU_FEATURES_API_URL: http://features-api:8082
      VINU_CORRELATION_API_URL: http://correlation-api:8083
    ports:
      - "8084:8084"
    volumes:
      - ./integration_test_data/strategy:/data
    restart: unless-stopped
    depends_on:
      - features-api
      - correlation-api

  # =========================================================================
  # vinu-simulator Services (Ports: 8085)
  # =========================================================================
  simulator-api:
    build:
      context: ./vinu-simulator
      dockerfile: Dockerfile
    command: ["vinu-simulator", "serve", "--host", "0.0.0.0", "--port", "8085"]
    env_file: ./vinu-simulator/.env
    environment:
      VINU_SIMULATOR_DATA_ROOT: /data
      VINU_STRATEGY_API_URL: http://strategy-api:8084
      VINU_STOCK_API_URL: http://stock-api:8081
    ports:
      - "8085:8085"
    volumes:
      - ./integration_test_data/simulator:/data
    restart: unless-stopped
    depends_on:
      - strategy-api
      - stock-api
