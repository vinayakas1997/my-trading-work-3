# Optimizer knowledge library — NOT a fixed sweep plan.
# See SKILL.md for the adaptive search algorithm this feeds.
# Strategy/parameter names below are EXAMPLES — confirm against vinu-strategy
# before wiring this up.

defaults:
  convergence:
    max_iterations: 50
    stop_if_no_improvement_for: 5
  primary_objective: sharpe_oos
  tiebreaker: maxdd_oos_ascending
  # Multiplier applied to seed_step when a coarse pass shows high sensitivity
  # (narrow to refine) vs low sensitivity (widen to re-search).
  refine_step_factor: 0.5
  widen_bounds_by_steps: 5

# Generic knowledge, keyed by parameter TYPE not by strategy or indicator
# name. A strategy's parameter just points at one of these to inherit a
# reasonable starting point. This is the "library" — add a type here once,
# every strategy that uses that kind of parameter benefits.
parameter_library:
  moving_average_period:
    unit: bars
    seed_step: 1
    seed_bounds_pm: 5        # +/- around the strategy's stated default
    notes: >
      Short periods (e.g. 9) are usually sensitive at step=1 within a small
      window. Long periods (e.g. 200) often need a much wider window before
      sensitivity shows up — widen aggressively before concluding "not useful."

  oscillator_threshold:
    unit: index_points        # e.g. RSI, ADX levels (0-100 scale)
    seed_step: 5
    seed_bounds_pm: 10
    notes: "Typical for RSI/ADX/Stochastic style bounded oscillators."

  ratio_threshold:
    unit: fraction
    seed_step: 0.05
    seed_bounds_pm: 0.10
    notes: "Typical for Hurst-exponent style 0-1 thresholds."

  atr_multiplier:
    unit: multiplier
    seed_step: 0.5
    seed_bounds_pm: 1.0
    notes: "Typical for ATR-based trailing stop distances."

  signal_threshold:
    unit: raw_ratio
    seed_step: 0.01
    seed_bounds_pm: 0.02
    notes: "Small-magnitude signal cutoffs, e.g. momentum/volatility ratios."

# Strategies just declare which parameters they expose and which library
# type each maps to, plus any override of the library defaults if this
# strategy genuinely needs a different starting point. No range/step
# duplication here.
strategies:
  hurst_regime:
    parameters:
      hurst_trend_threshold:
        param_type: ratio_threshold
        default: 0.55
      hurst_reversion_threshold:
        param_type: ratio_threshold
        default: 0.40
      trail_atr_mult:
        param_type: atr_multiplier
        default: 3.0
    gatekeepers_required:
      - min_trade_count
      - sharpe_floor
      - sharpe_is_floor
      - drawdown_ratio
      - walk_forward_windows
      - cost_realism

  adaptive_vwap_mean_reversion:
    parameters:
      adx_weak_threshold:
        param_type: oscillator_threshold
        default: 30
      rsi_oversold:
        param_type: oscillator_threshold
        default: 45
      rsi_overbought:
        param_type: oscillator_threshold
        default: 55
      atr_trail_mult_wide:
        param_type: atr_multiplier
        default: 2.5
      atr_trail_mult_tight:
        param_type: atr_multiplier
        default: 1.0
    gatekeepers_required:
      - min_trade_count
      - sharpe_floor
      - drawdown_ratio
      - parameter_sensitivity
      - cost_realism
      - beats_benchmark

  hull_ma_slope_rider:
    parameters:
      hull_period:
        param_type: moving_average_period
        default: 20
      slope_lookback:
        param_type: moving_average_period
        default: 3
      sma_filter_period:
        param_type: moving_average_period
        default: 50
      stop_atr_mult:
        param_type: atr_multiplier
        default: 3.0
    gatekeepers_required:
      - min_trade_count
      - sharpe_floor
      - drawdown_ratio
      - walk_forward_windows
      - cost_realism
