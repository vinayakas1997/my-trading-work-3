[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-simulator"
version = "0.1.0"
description = "Backtesting engine — realistic simulation with slippage, commission, position accounting, and benchmark comparison"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyarrow>=15.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vinu-simulator = "vinu_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_simulator*"]

[tool.setuptools.package-data]
vinu_simulator = ["server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
