site_name: vinu-strategy Documentation
site_description: Decision fusion layer for trading strategy execution
site_url: https://vinu-strategy.readthedocs.io
repo_url: https://github.com/anomalyco/vinu-strategy
edit_uri: edit/main/docs/book/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  logo: logo.png
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Getting Started:
      - Introduction: getting-started/introduction.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline Design: architecture/pipeline.md
      - Components: architecture/components.md
      - Data Flow: architecture/data-flow.md
  - Strategy Authoring:
      - YAML Schema: strategy-authoring/yaml-schema.md
      - Feature Catalog: strategy-authoring/features-catalog.md
      - Correlation Fields: strategy-authoring/correlation-fields.md
      - Pipeline Methods: strategy-authoring/pipeline-methods.md
      - Rules DSL: strategy-authoring/rules-dsl.md
      - Examples: strategy-authoring/examples.md
  - API Reference:
      - CLI: api-reference/cli.md
      - HTTP API: api-reference/http-api.md
      - Python API: api-reference/python-api.md
  - Storage:
      - Weight Storage: storage/weights.md
      - Metadata Storage: storage/metadata.md
  - Testing:
      - Test Guide: testing/test-guide.md
  - Deployment:
      - Docker: deployment/docker.md
      - Production Setup: deployment/production.md
  - Version History:
      - Version 1: versioning/v1.md
      - Version 2: versioning/v2.md
      - Version 3: versioning/v3.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            docstring_style: google