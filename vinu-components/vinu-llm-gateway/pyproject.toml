[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-llm-gateway"
version = "0.1.0"
description = "One priority queue in front of the single-slot local LLM: callers ask by purpose, the queue decides who goes next"
requires-python = ">=3.10"
dependencies = [
  "vinu-infra",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vinu-llm-gateway = "vinu_llm_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_llm_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
