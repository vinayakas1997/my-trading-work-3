[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-screener"
version = "0.1.0"
description = "Rule-based full-market scanner — condition schema, scan loop, and filter/score/risk-overlay pipeline (research-discussion-v1/complete-plan/03-stage-b-vinu-screener.md)"
requires-python = ">=3.10"
dependencies = [
  "vinu-infra",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.25",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vinu-screener = "vinu_screener.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_screener*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
