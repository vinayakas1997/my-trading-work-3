[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-research"
version = "0.1.0"
description = "Agentic Strategy Researcher — multi-agent loop that generates, backtests, and refines trading strategies"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vinu-research = "vinu_research.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_research*"]

[tool.setuptools.package-data]
vinu_research = ["server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
