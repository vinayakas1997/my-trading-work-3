[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-lib"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pyarrow>=15.0",
  "httpx>=0.27",
  "requests>=2.31",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["vinu_lib"]
package-dir = {"vinu_lib" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
