# Pipeline edge manifest -- see pipeline_edges.py and
# newer-thinking-with-discussed/the-inconsistencies-v2/03-implementation-plan.md (Phase 1).
#
# One entry per "this output must be consumed there" connection on the money path.
#   status: wired  -> consumer source must reference the producer's output (regression check)
#   status: gap    -> a known missing connection; consumer must NOT reference it yet.
#                     Wiring it makes the test fail with DRIFT_NOW_WIRED: flip it to `wired`.
# Paths are relative to vinu-components/. Tokens are matched as plain substrings in
# non-comment lines; choose call-shaped tokens (a route path or function call).
# `empty_ok`: true when "producer returned nothing yet" is a legitimate answer
# (see routes_introspect.py's empty-meaning contract).
version: 1

edges:

  # ---------------- Layer 4/5 -> 6: what the live executors consume ----------------

  - id: portfolio.state->live.scheduler
    producer:
      service: vinu-portfolio
      files: [vinu-portfolio/vinu_portfolio/server/app.py]
      defines: ['"/state"']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['/portfolio/state']
      purpose: base risk-parity target weights that the scheduler turns into orders
    cadence: per scheduler cycle (3600s default)
    empty_ok: true
    status: wired
    instrumented: true
    stale_after_sec: 8000

  - id: portfolio.daily_allocation->live.scheduler
    producer:
      service: vinu-portfolio
      files: [vinu-portfolio/vinu_portfolio/server/app.py]
      defines: ['"/daily-allocation"']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['/portfolio/daily-allocation', 'compute_daily_allocation(']
      purpose: tilted weights + deployable_equity (drawdown halve, maturity scaling, reserve)
    cadence: per scheduler cycle
    empty_ok: false
    status: wired
    instrumented: true
    stale_after_sec: 8000
    note: wired 2026-10-03 (logic-audit A1), but read only when scheduler_use_daily_allocation is on (default off); when on, portfolio.state is read only as the fallback

  - id: live_decision.executes->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/live_decision/storage.py]
      defines: ['def list_unapplied_executes']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['list_unapplied_executes(']
      purpose: folds approved live-decision EXECUTE verdicts into target weights
    cadence: per scheduler cycle
    empty_ok: true
    status: wired
    instrumented: true
    stale_after_sec: 8000

  - id: strategy.config->live.scheduler
    producer:
      service: vinu-strategy
      files: [vinu-strategy/vinu_strategy/server/routes_read.py]
      defines: ['"/strategies/{name}"']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['/strategy/strategies/']
      purpose: reads live_decision_position_size to size an EXECUTE
    cadence: per EXECUTE
    empty_ok: false
    status: wired
    instrumented: true

  - id: research.active_trade_plans->live.orchestrator
    producer:
      service: vinu-research
      files: [vinu-research/vinu_research/server/routes_read.py]
      defines: ['"/artifacts"']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/orchestrator.py]
      references: ['"type_": "trade_plan"']
      purpose: the plans the orchestrator enters, monitors and exits
    cadence: per orchestrator cycle (~90s)
    empty_ok: true
    status: wired
    instrumented: true
    stale_after_sec: 1800

  - id: research.created_trade_plans->live.approval_worker
    producer:
      service: vinu-research
      files: [vinu-research/vinu_research/server/routes_trade_plan.py]
      defines: ['def approve_trade_plan_route']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan_approval_worker.py]
      references: ['/approve']
      purpose: schedules approval of CREATED plans (the gate itself lives in research)
    cadence: per approval-worker cycle
    empty_ok: true
    status: wired
    instrumented: true
    stale_after_sec: 3000

  # ---------------- risk and halt signals ----------------

  - id: portfolio.risk_status->agent.order_guard
