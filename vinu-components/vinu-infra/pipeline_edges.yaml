      references: ['/notify/reconciliation-drift']
      purpose: alert when expected-vs-actual drift persists for 3 cycles
    cadence: edge-triggered
    empty_ok: true
    status: wired
    instrumented: true

  # ---------------- live-decision position protection (plan 2.3) ----------------

  - id: strategy.stop_rules->live.poller
    producer:
      service: vinu-strategy
      files: [vinu-strategy/vinu_strategy/api.py]
