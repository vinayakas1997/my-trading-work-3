      files: [vinu-live/vinu_live/scheduler.py]
      references: ['precondition_held']
      purpose: skip an EXECUTE whose strategy precondition did not hold
    cadence: per EXECUTE
    empty_ok: false
    status: wired
    instrumented: true
    note: wired 2026-10-03 (inconsistencies v1 A8), but enforced only when precondition_enforcing_enabled is on (default off)

