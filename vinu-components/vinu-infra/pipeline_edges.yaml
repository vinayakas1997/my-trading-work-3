    empty_ok: true
    status: wired
    instrumented: true
    note: added 2026-10-02 (plan 2.3); approximates the fill with the last daily close

  # ---------------- live-decision visibility and recovery (plan 2.4) ----------------

  - id: live_decision.unsized_executes->live.api
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/live_decision/storage.py]
