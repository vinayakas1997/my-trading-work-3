    cadence: per order
    empty_ok: false
    status: wired
    instrumented: true

  - id: portfolio.state->agent.order_guard
    producer:
      service: vinu-portfolio
      files: [vinu-portfolio/vinu_portfolio/server/app.py]
      defines: ['"/state"']
    consumer:
      service: vinu-agent
      files: [vinu-agent/vinu_agent/broker/order_guard.py]
      references: ['/portfolio/state']
      purpose: pairwise-correlation / concentration check on every order
    cadence: per order
    empty_ok: true
    status: wired
    instrumented: true

  - id: halt_flag->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/guards.py]
      defines: ['async def halt_reason']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['halt_reason(']
      purpose: stop order execution when the local HALT file or remote kill switch is on
    cadence: per cycle and per slice
    empty_ok: true
    status: wired
    instrumented: true

  - id: halt_flag->live.orchestrator
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/guards.py]
      defines: ['async def halt_reason']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/orchestrator.py]
      references: ['_halt_reason(']
      purpose: block new entries during a halt (exits stay allowed)
    cadence: per cycle
    empty_ok: true
    status: wired
    instrumented: true

  - id: breaker.limits->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/breaker/engine.py]
      defines: ['def check_limits']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['check_limits(']
      purpose: daily-loss / VaR / leverage / cluster / position-count halt before orders
    cadence: per cycle
    empty_ok: false
    status: wired
    instrumented: true

  - id: drawdown_status->portfolio.allocation
    producer:
      service: vinu-portfolio
      files: [vinu-portfolio/vinu_portfolio/storage/drawdown_status.py]
      defines: ['class DrawdownStatusStore']
    consumer:
      service: vinu-portfolio
      files: [vinu-portfolio/vinu_portfolio/service.py]
      references: ['DrawdownStatusStore(']
      purpose: halve/flat/halt multiplier inside compute_daily_allocation
    cadence: per allocation
    empty_ok: true
    status: wired
    instrumented: true
    note: wired inside compute_daily_allocation only -- see portfolio.daily_allocation->live.scheduler

  # ---------------- guard parity between the two executors ----------------

  - id: guard.cooldown->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/orchestrator.py]
      defines: ['def cooldown_active']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['cooldown_active(']
      purpose: pause new entries after consecutive losses
    cadence: per cycle
    empty_ok: true
    status: wired
    instrumented: true
    note: wired 2026-10-02 (plan 2.2); opt-in via scheduler_entry_guards_enabled / VINU_LIVE_SCHEDULER_ENTRY_GUARDS_ENABLED, default off; entries only

  - id: guard.turbulence->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/orchestrator.py]
      defines: ['async def turbulence_active']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['turbulence_active(']
      purpose: pause new entries when 14-day realized vol is extreme
    cadence: per cycle
    empty_ok: true
    status: wired
    instrumented: true
    note: wired 2026-10-02 (plan 2.2); opt-in via scheduler_entry_guards_enabled / VINU_LIVE_SCHEDULER_ENTRY_GUARDS_ENABLED, default off; entries only

  - id: guard.data_freshness->live.scheduler
