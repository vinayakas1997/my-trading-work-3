    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['reduce_only']
      purpose: risk-reducing orders pass halts and entry-only gates
    cadence: per order
    empty_ok: false
    status: wired
    instrumented: true
    note: wired 2026-10-03 (logic-audit A5), but only when scheduler_exits_exempt_from_halts is on (default off)

  - id: book.writes->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/book/positions.py]
      defines: ['def open_position', 'def close_position']
    consumer:
      service: vinu-live
      files: [vinu-live/vinu_live/scheduler.py]
      references: ['open_position(self._book', 'close_position(self._book', 'reduce_position(self._book']
      purpose: scheduler-placed orders recorded in the book the breaker checks
    cadence: per fill
    empty_ok: false
    status: gap
    gap_ref: logic-audit-2026-10-02 A6
    note: scheduler reads the book for check_limits() but never writes its own positions to it

  - id: precondition_held->live.scheduler
