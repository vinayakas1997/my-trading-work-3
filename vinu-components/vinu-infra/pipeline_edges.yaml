      references: ['PRICE_MAX_AGE_HOURS', '_price_ts_age_hours(']
      purpose: do not trade on a price from a stalled feed
    cadence: per cycle
    empty_ok: true
    status: wired
    instrumented: true
    note: wired 2026-10-02 (plan 2.2); opt-in via scheduler_entry_guards_enabled / VINU_LIVE_SCHEDULER_ENTRY_GUARDS_ENABLED, default off; entries only

  - id: order.reduce_only->live.scheduler
    producer:
      service: vinu-live
      files: [vinu-live/vinu_live/trade_plan/orchestrator.py]
