[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-tools"
version = "0.2.0"
description = "Alpha factor computation, ML models, TA indicators, and run registry"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyarrow>=15.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]

[project.scripts]
vinu-tools = "vinu_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_tools*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
