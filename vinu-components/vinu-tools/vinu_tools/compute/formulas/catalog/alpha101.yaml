alpha101_001:
  id: alpha101_001
  theme: [reversal, volatility]
  formula: rank(ts_argmax(SignedPower((returns<0)?stddev(returns,20):close, 2.), 5)) - 0.5
  columns_required: [close]
  universe: [equity_us, equity_in]
  frequency: [1D]
  decay_horizon: 5
  min_warmup_bars: 25
  params:
    window:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
  description: Detects potential price reversals by identifying overextended moves or divergences. It computes the conditional
    returns if returns, else close price. The signal uses a 5-period estimation window. Rises during market stress and volatile
    periods. Falls during calm, trending markets. Uses close price data. Best suited for mean reversion.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Best used near price extremes for contrarian entries. Rises during market stress, falls during calm periods
  when_to_use: volatility_breakout, options_trading, risk_management, mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/alpha101/alpha_001.py
alpha101_002:
  id: alpha101_002
  theme: [volume, reversal]
  formula: -1 * correlation(rank(delta(log(volume), 2)), rank(((close-open)/open)), 6)
  columns_required: [open, close, volume]
  universe: [equity_us, equity_in]
  frequency: [1D]
  decay_horizon: 5
  min_warmup_bars: 10
  params:
    window_1:
      default: 6
      range: [3, 24]
      description: 'window parameter (original: 6)'
    lag:
      default: 2
      range: [1, 8]
      description: 'lag parameter (original: 2)'
  description: Captures momentum-adjusted price changes relative to market activity. It computes the Inverted, 2-period change
    in log(volume), with further adjustment via cross-sectional rank applied to normalize output across assets. Negated to
    create an inverse signal — high raw values predict downward moves. When volume rises but price stalls, correlation drops
    — signaling potential reversal or exhaustion. Uses close price, open price, volume data. Best suited for volume analysis.
  interpretation: Range [-1, 1]. High positive = trend continuation (sell). High negative = volume-price divergence, reversal
    expected (buy).. Best used near price extremes for contrarian entries. Volume spikes indicate institutional activity or
    unusual interest
  when_to_use: volume_analysis, liquidity_screening, accumulation_distribution, mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/alpha101/alpha_002.py
