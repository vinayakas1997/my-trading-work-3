gtja191_001:
  id: gtja191_001
  theme: [volume, reversal]
  formula: (-1 * CORR(RANK(DELTA(LOG(VOLUME), 1)), RANK(((CLOSE - OPEN) / OPEN)), 6))
  columns_required: [volume, close, open]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 6
  min_warmup_bars: 7
  description: Measures 6-day correlation between volume change rank and intraday return rank. When volume increases but price
    does not follow, correlation drops → negative final value → reversal signal.
  interpretation: 'Range [-1, 1]. High positive: trend continuation (sell). High negative: volume-price divergence → reversal
    expected (buy).'
  when_to_use: short_term_reversal, volume_price_divergence, liquidity_analysis
  source: factors/singles/gtja191/alpha_001.py
gtja191_002:
  id: gtja191_002
  theme: [reversal, microstructure]
  formula: (-1 * DELTA(((CLOSE - LOW) - (HIGH - CLOSE)) / (HIGH - LOW), 1))
  columns_required: [close, high, low]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 1
  min_warmup_bars: 2
  description: Daily change in close position within the high-low range. If close moves from near low to near high, positive
    delta → continuation. If it shifts from near high to near low, negative delta → reversal.
  interpretation: 'Range unbounded. Positive: upward intraday structure strengthening. Negative: downward intraday structure.
    Values close to -1/+1 suggest exhaustion.'
  when_to_use: intraday_structure, price_position, micro_structure
  source: factors/singles/gtja191/alpha_002.py
gtja191_003:
  id: gtja191_003
  theme: [momentum]
  formula: SUM((CLOSE=DELAY(CLOSE,1)?0:CLOSE-(CLOSE>DELAY(CLOSE,1)?MIN(LOW,DELAY(CLOSE,1)):MAX(HIGH,DELAY(CLOSE,1)))),6)
  columns_required: [close, high, low]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 6
  min_warmup_bars: 7
  description: Sum of directional price movement over 6 days. If close rises, adds distance from low of previous close. If
    close falls, subtracts distance from high of previous close. Captures trend strength.
  interpretation: 'Range unbounded. High positive: strong upward trend over 6 days. High negative: strong downward trend.'
  when_to_use: trend_strength, directional_momentum, trend_following
  source: factors/singles/gtja191/alpha_003.py
gtja191_004:
  id: gtja191_004
  theme: [momentum, volume]
  formula: ((((SUM(CLOSE,8)/8)+STD(CLOSE,8))<(SUM(CLOSE,2)/2))?(-1):((SUM(CLOSE,2)/2<(SUM(CLOSE,8)/8-STD(CLOSE,8)))?1:((1<(VOLUME/MEAN(VOLUME,20)))?1:(-1))))
  columns_required: [close, volume]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 8
  min_warmup_bars: 20
  description: Volume-confirmed trend signal. Compares short-term (2-day) vs medium-term (8-day) average close with volatility
    band. If price below lower band, trend is down (-1). If above upper band, trend is up (1). If inside bands, checks if
    volume is above average (1) or below (-1).
  interpretation: -1 = downtrend or low confidence. 1 = uptrend or high confidence. Ternary logic makes values discrete.
  when_to_use: trend_confirmation, volume_confirmed_trend, regime_detection
  source: factors/singles/gtja191/alpha_004.py
gtja191_005:
  id: gtja191_005
  theme: [volume]
  formula: (-1 * TSMAX(CORR(TSRANK(VOLUME,5), TSRANK(HIGH,5), 5), 3))
  columns_required: [volume, high]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 13
  description: 3-day max of the 5-day rolling correlation between volume rank and high rank. Captures whether volume and price
    highs move together or diverge over short windows.
  interpretation: 'Range [-1, 1]. High positive: volume and price highs move together (confirmed uptrend). High negative:
    volume diverges from price highs (potential reversal).'
  when_to_use: volume_price_correlation, short_term_divergence, trend_health
  source: factors/singles/gtja191/alpha_005.py
gtja191_006:
  id: gtja191_006
  theme: [reversal]
  formula: (RANK(SIGN(DELTA((OPEN*0.85+HIGH*0.15), 4))) * -1)
  columns_required: [open, high]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 4
  min_warmup_bars: 5
  params:
    lag:
      default: 4
      range: [2, 16]
      description: 'lag parameter (original: 4)'
  description: Captures momentum-adjusted price changes relative to market activity. It computes the 4-period change in open
    price multiplied by high price multiplied by 0.15. The signal uses a 4-period estimation window. Uses open price, high
    price data. Best suited for mean reversion.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Best used near price extremes for contrarian entries
  when_to_use: mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_006.py
gtja191_007:
  id: gtja191_007
  theme: [volume, microstructure]
  formula: ((RANK(MAX((VWAP-CLOSE),3)) + RANK(MIN((VWAP-CLOSE),3))) * RANK(DELTA(VOLUME,3)))
  columns_required: [close, volume, amount]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 3
  min_warmup_bars: 4
  params:
    window:
      default: 3
      range: [1, 12]
      description: 'window parameter (original: 3)'
    window_1:
      default: 3
      range: [1, 12]
      description: 'window parameter (original: 3)'
    lag:
      default: 3
      range: [1, 12]
      description: 'lag parameter (original: 3)'
  description: Captures momentum-adjusted price changes relative to market activity. It computes the 3-period change in volume,
    with further adjustment via cross-sectional rank applied to normalize output across assets. The signal uses a 3-period
    estimation window. Uses close price, volume data. Best suited for volume analysis.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Volume spikes indicate institutional activity or unusual interest
  when_to_use: volume_analysis, liquidity_screening, accumulation_distribution, high_frequency, order_flow, intraday_trading
  source: factors/singles/gtja191/alpha_007.py
gtja191_008:
  id: gtja191_008
  theme: [reversal]
  formula: RANK(DELTA(((HIGH+LOW)/2)*0.2 + VWAP*0.8, 4)) * -1
  columns_required: [high, low, volume, amount]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 4
  min_warmup_bars: 5
  params:
    lag:
      default: 4
      range: [2, 16]
      description: 'lag parameter (original: 4)'
  description: Captures momentum-adjusted price changes relative to market activity. It computes the 4-period change in high
    price and low price divided by 2 multiplied by VWAP multiplied by 0.8. The signal uses a 4-period estimation window. Uses
    high price, low price, volume data. Best suited for mean reversion.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Best used near price extremes for contrarian entries
  when_to_use: mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_008.py
gtja191_009:
  id: gtja191_009
  theme: [volume, microstructure]
  formula: SMA(((HIGH+LOW)/2-(DELAY(HIGH,1)+DELAY(LOW,1))/2)*(HIGH-LOW)/VOLUME,7,2)
  columns_required: [high, low, volume]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 7
  min_warmup_bars: 8
  params:
    lag:
      default: 1
      range: [1, 4]
      description: 'lag parameter (original: 1)'
    lag_1:
      default: 1
      range: [1, 4]
      description: 'lag parameter (original: 1)'
  description: Analyzes trading volume patterns and their relationship with price movements. It computes the 1-period average
    of high price and low price divided by high price. The signal uses a 7-period estimation window. Uses high price, low
    price, volume data. Best suited for volume analysis.
  interpretation: Higher values indicate stronger factor exposure.. Volume spikes indicate institutional activity or unusual
    interest
  when_to_use: volume_analysis, liquidity_screening, accumulation_distribution, high_frequency, order_flow, intraday_trading
  source: factors/singles/gtja191/alpha_009.py
gtja191_010:
  id: gtja191_010
  theme: [volatility, reversal]
  formula: RANK(MAX(((RET<0)?STD(RET,20):CLOSE)^2,5))
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 21
  params:
    window:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
    window_1:
      default: 5
      range: [2, 20]
      description: 'window parameter (original: 5)'
  description: Quantifies price variability and expansion/contraction of trading ranges. It computes the 20-period volatility
    of returns. The signal uses a 5-period estimation window. Rises during market stress and volatile periods. Falls during
    calm, trending markets. Uses close price data. Best suited for volatility breakout.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Best used near price extremes for contrarian entries. Rises during market stress, falls during calm periods
  when_to_use: volatility_breakout, options_trading, risk_management, mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_010.py
gtja191_011:
  id: gtja191_011
  theme: [volume, microstructure]
  formula: SUM(((CLOSE-LOW)-(HIGH-CLOSE))/(HIGH-LOW)*VOLUME,6)
  columns_required: [close, high, low, volume]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 6
  min_warmup_bars: 7
  params:
    window:
      default: 6
      range: [3, 24]
      description: 'window parameter (original: 6)'
  description: Analyzes trading volume patterns and their relationship with price movements. It computes the 6-period sum
    of (close price minus low price and high price and close price) divided by (high price minus low price), with further
    adjustment via (close price minus low price and high price and close price) divided by (high price minus low price). The
    signal uses a 6-period estimation window. Values near 1 = close at range top (strength). Values near 0 = close at range
    bottom (weakness). Cross-sectional rank makes this relative across assets. Uses close price, high price, low price, volume
    data. Best suited for volume analysis.
  interpretation: Higher values indicate stronger factor exposure.. Volume spikes indicate institutional activity or unusual
    interest
  when_to_use: volume_analysis, liquidity_screening, accumulation_distribution, high_frequency, order_flow, intraday_trading
  source: factors/singles/gtja191/alpha_011.py
gtja191_012:
  id: gtja191_012
  theme: [reversal, microstructure]
  formula: (RANK((OPEN - (SUM(VWAP,10)/10))) * (-1 * RANK(ABS((CLOSE - VWAP)))))
  columns_required: [open, close, volume, amount]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 10
  min_warmup_bars: 11
  params:
    window:
      default: 10
      range: [5, 40]
      description: 'window parameter (original: 10)'
  description: Detects potential price reversals by identifying overextended moves or divergences. It computes the 10-period
    sum of VWAP, with further adjustment via cross-sectional rank applied to normalize output across assets. The signal uses
    a 10-period estimation window. Uses close price, open price, volume data. Best suited for mean reversion.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Best used near price extremes for contrarian entries
  when_to_use: high_frequency, order_flow, intraday_trading, mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_012.py
gtja191_013:
  id: gtja191_013
  theme: [microstructure]
  formula: (((HIGH*LOW)^0.5) - VWAP)
  columns_required: [high, low, volume, amount]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 1
  min_warmup_bars: 1
  description: Analyzes order flow, tick-level patterns, or intraday price dynamics. It computes the high price multiplied
    by low price raised to power 0. The signal uses a 1-period estimation window. Uses high price, low price, volume data.
    Best suited for high frequency.
  interpretation: Higher values indicate stronger factor exposure.
  when_to_use: high_frequency, order_flow, intraday_trading
  source: factors/singles/gtja191/alpha_013.py
gtja191_014:
  id: gtja191_014
  theme: [momentum]
  formula: CLOSE - DELAY(CLOSE,5)
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 6
  params:
    lag:
      default: 5
      range: [2, 20]
      description: 'lag parameter (original: 5)'
  description: Measures trend strength and directional price movement over a lookback window. It computes the close price
    relative to close price. The signal uses a 5-period estimation window. Uses close price data. Best suited for trend following.
  interpretation: Higher values indicate stronger factor exposure.. Works best in trending markets
  when_to_use: trend_following, breakout_trading, factor_investing
  source: factors/singles/gtja191/alpha_014.py
gtja191_015:
  id: gtja191_015
  theme: [reversal]
  formula: (OPEN/DELAY(CLOSE,1) - 1)
  columns_required: [open, close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 1
  min_warmup_bars: 2
  params:
    lag:
      default: 1
      range: [1, 4]
      description: 'lag parameter (original: 1)'
  description: Detects potential price reversals by identifying overextended moves or divergences. It computes the open price
    divided by close price. The signal uses a 1-period estimation window. Uses close price, open price data. Best suited for
    mean reversion.
  interpretation: Higher values indicate stronger factor exposure.. Best used near price extremes for contrarian entries
  when_to_use: mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_015.py
gtja191_016:
  id: gtja191_016
  theme: [volume, microstructure]
  formula: (-1 * TSMAX(RANK(CORR(RANK(VOLUME), RANK(VWAP), 5)), 5))
  columns_required: [volume, amount]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 11
  params:
    window:
      default: 5
      range: [2, 20]
      description: 'window parameter (original: 5)'
    window_1:
      default: 5
      range: [2, 20]
      description: 'window parameter (original: 5)'
  description: Measures the correlation between trading activity and price movement. It computes the Inverted, 5-period rolling
    correlation between cross-sectional rank of volume and cross-sectional rank of VWAP, with further adjustment via cross-sectional
    rank applied to normalize output across assets. Negated to create an inverse signal — high raw values predict downward
    moves. Useful for detecting volume-confirmed breakouts (high corr) or distribution days (low corr). Uses volume data.
    Best suited for volume analysis.
  interpretation: Range [-1, 1]. High positive = trend continuation (sell). High negative = volume-price divergence, reversal
    expected (buy).. Volume spikes indicate institutional activity or unusual interest
  when_to_use: volume_analysis, liquidity_screening, accumulation_distribution, high_frequency, order_flow, intraday_trading
  source: factors/singles/gtja191/alpha_016.py
gtja191_017:
  id: gtja191_017
  theme: [reversal]
  formula: (RANK(VWAP - MAX(VWAP,15))^DELTA(CLOSE,5))
  columns_required: [close, volume, amount]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 15
  min_warmup_bars: 16
  params:
    window:
      default: 15
      range: [7, 60]
      description: 'window parameter (original: 15)'
    lag:
      default: 5
      range: [2, 20]
      description: 'lag parameter (original: 5)'
  description: Captures momentum-adjusted price changes relative to market activity. It computes the 5-period change in close
    price. The signal uses a 15-period estimation window. Uses close price, volume data. Best suited for mean reversion.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Best used near price extremes for contrarian entries
  when_to_use: mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_017.py
gtja191_018:
  id: gtja191_018
  theme: [momentum]
  formula: CLOSE/DELAY(CLOSE,5)
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 6
  params:
    lag:
      default: 5
      range: [2, 20]
      description: 'lag parameter (original: 5)'
  description: Measures trend strength and directional price movement over a lookback window. It computes the close price
    divided by close price. The signal uses a 5-period estimation window. Uses close price data. Best suited for trend following.
  interpretation: Higher values indicate stronger factor exposure.. Works best in trending markets
  when_to_use: trend_following, breakout_trading, factor_investing
  source: factors/singles/gtja191/alpha_018.py
gtja191_019:
  id: gtja191_019
  theme: [reversal]
  formula: (CLOSE<DELAY(CLOSE,5)?(CLOSE-DELAY(CLOSE,5))/DELAY(CLOSE,5):(CLOSE=DELAY(CLOSE,5)?0:(CLOSE-DELAY(CLOSE,5))/CLOSE))
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 6
  params:
    lag:
      default: 5
      range: [2, 20]
      description: 'lag parameter (original: 5)'
  description: Detects potential price reversals by identifying overextended moves or divergences. It computes the conditional
    close price relative to close price divided by close price if close price and close price, else close price and close
    price. The signal uses a 5-period estimation window. Uses close price data. Best suited for mean reversion.
  interpretation: Higher values indicate stronger factor exposure.. Best used near price extremes for contrarian entries
  when_to_use: mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_019.py
gtja191_020:
  id: gtja191_020
  theme: [momentum]
  formula: ((CLOSE-DELAY(CLOSE,6))/DELAY(CLOSE,6))*100
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 6
  min_warmup_bars: 7
  params:
    lag:
      default: 6
      range: [3, 24]
      description: 'lag parameter (original: 6)'
  description: Measures trend strength and directional price movement over a lookback window. It computes the close price
    relative to close price divided by close price multiplied by 100. The signal uses a 6-period estimation window. Uses close
    price data. Best suited for trend following.
  interpretation: Higher values indicate stronger factor exposure.. Works best in trending markets
  when_to_use: trend_following, breakout_trading, factor_investing
  source: factors/singles/gtja191/alpha_020.py
gtja191_021:
  id: gtja191_021
  theme: [momentum]
  formula: REGBETA(MEAN(CLOSE,6), SEQUENCE(6))
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 6
  min_warmup_bars: 12
  params:
    window:
      default: 6
      range: [3, 24]
      description: 'window parameter (original: 6)'
  description: Measures trend strength and directional price movement over a lookback window. It computes the 6-period average
    of close price. The signal uses a 6-period estimation window. Uses close price data. Best suited for trend following.
  interpretation: Higher values indicate stronger factor exposure.. Works best in trending markets
  when_to_use: trend_following, breakout_trading, factor_investing
  source: factors/singles/gtja191/alpha_021.py
gtja191_022:
  id: gtja191_022
  theme: [reversal]
  formula: SMA(((CLOSE-MEAN(CLOSE,6))/MEAN(CLOSE,6) - DELAY((CLOSE-MEAN(CLOSE,6))/MEAN(CLOSE,6),3)),12,1)
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 12
  min_warmup_bars: 10
  params:
    lag:
      default: 6
      range: [3, 24]
      description: 'lag parameter (original: 6)'
  description: Detects potential price reversals by identifying overextended moves or divergences. It computes the 6-period
    average of close price relative to close price, with further adjustment via 6-period average of close price. The signal
    uses a 12-period estimation window. Uses close price data. Best suited for mean reversion.
  interpretation: Higher values indicate stronger factor exposure.. Best used near price extremes for contrarian entries
  when_to_use: mean_reversion, contrarian_trading, exhaustion_detection
  source: factors/singles/gtja191/alpha_022.py
gtja191_023:
  id: gtja191_023
  theme: [volatility]
  formula: SMA((CLOSE>DELAY(CLOSE,1)?STD(CLOSE,20):0),20,1)/(SMA((CLOSE>DELAY(CLOSE,1)?STD(CLOSE,20):0),20,1) + SMA((CLOSE<=DELAY(CLOSE,1)?STD(CLOSE,20):0),20,1))
    * 100
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 20
  min_warmup_bars: 22
  params:
    window:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
    window_1:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
    window_2:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
    lag:
      default: 1
      range: [1, 4]
      description: 'lag parameter (original: 1)'
    lag_1:
      default: 1
      range: [1, 4]
      description: 'lag parameter (original: 1)'
    lag_2:
      default: 1
      range: [1, 4]
      description: 'lag parameter (original: 1)'
  description: Quantifies price variability and expansion/contraction of trading ranges. It computes the 20-period volatility
    of close price, with further adjustment via 1-period average of close price and close price, conditional close price if
    close price and close price, else 0. The signal uses a 20-period estimation window. Rises during market stress and volatile
    periods. Falls during calm, trending markets. Uses close price data. Best suited for volatility breakout.
  interpretation: Higher values indicate stronger factor exposure.. Rises during market stress, falls during calm periods
  when_to_use: volatility_breakout, options_trading, risk_management
  source: factors/singles/gtja191/alpha_023.py
gtja191_024:
  id: gtja191_024
  theme: [momentum]
  formula: SMA(CLOSE-DELAY(CLOSE,5),5,1)
  columns_required: [close]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 5
  min_warmup_bars: 6
  params:
    lag:
      default: 5
      range: [2, 20]
      description: 'lag parameter (original: 5)'
  description: Measures trend strength and directional price movement over a lookback window. It computes the 5-period average
    of close price relative to close price. The signal uses a 5-period estimation window. Uses close price data. Best suited
    for trend following.
  interpretation: Higher values indicate stronger factor exposure.. Works best in trending markets
  when_to_use: trend_following, breakout_trading, factor_investing
  source: factors/singles/gtja191/alpha_024.py
gtja191_025:
  id: gtja191_025
  theme: [momentum, volume]
  formula: ((-1*RANK((DELTA(CLOSE,7)*(1-RANK(DECAYLINEAR((VOLUME/MEAN(VOLUME,20)),9))))))*(1+RANK(SUM(RET,250))))
  columns_required: [close, volume]
  universe: [equity_cn]
  frequency: [1d]
  decay_horizon: 9
  min_warmup_bars: 61
  params:
    window_1:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
    window_2:
      default: 250
      range: [125, 252]
      description: 'window parameter (original: 250)'
    window_3:
      default: 20
      range: [10, 80]
      description: 'window parameter (original: 20)'
    lag:
      default: 7
      range: [3, 28]
      description: 'lag parameter (original: 7)'
  description: Captures momentum-adjusted price changes relative to market activity. It computes the 7-period change in close
    price, with further adjustment via 20-period average of volume, 250-period sum of returns, 20-period linearly weighted
    average of volume divided by volume, cross-sectional rank applied to normalize output across assets. The signal uses a
    9-period estimation window. Uses close price, volume data. Best suited for trend following.
  interpretation: Cross-sectional rank [0, 1]. Values near 1 = strong factor exposure. Values near 0 = weak or negative exposure..
    Works best in trending markets. Volume spikes indicate institutional activity or unusual interest
  when_to_use: volume_analysis, liquidity_screening, accumulation_distribution, trend_following, breakout_trading, factor_investing
  source: factors/singles/gtja191/alpha_025.py
gtja191_026:
  id: gtja191_026
  theme: [momentum, microstructure]
  formula: ((((SUM(CLOSE,7)/7)-CLOSE))+((CORR(VWAP,DELAY(CLOSE,5),230))))
