name: e2e_easy_sma_crossover
description: "Stage 1 E2E easy tier — 20/50 SMA crossover, long-only tilt, no ML/LLM dependency"
schedule: daily
features_required:
  - sma_20
  - sma_50
angles_required:
  - regime_analysis
universe:
  source: inline
  inline: [AAPL, TSLA, JNJ]
pipeline:
  selection:
    method: all
  allocation:
    method: signal_scaled
    signal: "sma_20 / sma_50 - 1"
  timing:
    method: rules
    rules:
      - name: bear_exit
        when:
          - {source: angles, key: regime_analysis.regime, eq: "bear"}
        then: {action: weight_set, value: 0.0}
  risk:
    method: normalize
    max_weight: 0.25
    cash_floor: 0.10
