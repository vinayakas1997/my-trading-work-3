name: ma_crossover
description: "Simple 9/21 SMA crossover — long when fast > slow, short when fast < slow"
schedule: daily
features_required:
  - SMA_9
  - SMA_21
angles_required:
  - regime_analysis
pipeline:
  selection:
    method: all
  allocation:
    method: signal_scaled
    signal: "SMA_9 / SMA_21 - 1"
  timing:
    method: rules
    rules:
      - name: bear_exit
        when:
          - {source: angles, key: regime_analysis.regime, eq: "bear"}
        then: {action: weight_set, value: 0.0}
  risk:
    max_weight: 0.25
    cash_floor: 0.10
    method: normalize
