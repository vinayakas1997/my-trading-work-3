# Governor numeric defaults. See SKILL.md for what each of these controls
# and why. Paired with optimizer-rules/rules.yaml — this file owns the
# stopping-decision numbers; that file owns the search-shape numbers.

hard_limits:
  # The only real hard limit backing this loop today — confirmed in
  # vinu_agent/agent/loop.py:41 (max_iterations: int = 50). Not
  # independently configurable per-search; it's the agent runtime's own cap.
  react_max_iterations: 50
  # Fraction of react_max_iterations at which the runtime's own wrap-up
  # nudge fires (vinu_agent/agent/loop.py:81, remaining <= 20%) — treat
  # this as the real deadline for saving resumable state, not iteration 50.
  wrap_up_at_fraction: 0.8

progress_heuristic:
  stop_if_no_improvement_for: 5   # consecutive rounds, per parameter
  # A round only counts as "improved" if it beats the best-so-far by more
  # than this multiple of optimizer-rules' seed_step for that parameter's
  # type — avoids treating floating-point noise as improvement.
  min_improvement_step_factor: 0.5

expectancy_heuristic:
  # Continue while EV > this (0.0 = strictly positive expectancy required).
  ev_continue_threshold: 0.0
  # How many extra rounds a favorable EV can justify past a progress-heuristic
  # stall before Layer 1's hard cap-style bound reasserts (see SKILL.md's
  # disagreement section) — bounds patience, doesn't grant indefinite override.
  expectancy_override_cap: 3
