# Gatekeepers — machine-readable checks over REAL, CONFIRMED fields.
# See SKILL.md for how these are meant to be used and for the two-moment
# distinction (candidate evaluation vs. promotion evaluation).
#
# Every `source` below points at real code, read in full as part of
# portfoli-mc-improvement Step 03:
#   vinu_simulator/engine/validation.py::compute_validation_verdict
#   vinu_research/pbo.py::probability_of_backtest_overfitting
#   vinu_research/gates/correlation_gate.py::CorrelationVerdict
#   vinu_research/promotion.py::meets_promotion_bar / PromotionVerdict
#   vinu_agent/skills/backtest-diagnose/SKILL.md (reused, not duplicated)
#
# No placeholder field names remain — every `check` below reads a field
# that a real function actually returns.

candidate_evaluation:
  # Applied to one backtest result, during a sweep or a research iteration.

  - id: statistical_validation
    source: "vinu_simulator/engine/validation.py::compute_validation_verdict"
    fetch_via: "get_backtest_validation tool (Step 02)"
    check: "validation.passed == true"
    severity: hard
    reason: >
      Combines 7 statistical tests (monte_carlo p<0.05, block_bootstrap
      p<0.05, price_path p<0.10, walk_forward consistency_rate>=0.6,
      bootstrap ci_low>0, bca ci_low>0, placebo p<0.05). Fails closed if
      no sub-test had enough data. This is the strongest available
      evidence that a result isn't noise — a failure here means the
      result is statistically indistinguishable from random.

  - id: min_trade_count
    source: "vinu-agent/skills/backtest-diagnose/SKILL.md (hard-gate checklist)"
    check: "trade_count >= 30"
    severity: hard
    reason: >
      Reused, not re-derived — compute_validation_verdict does not check
      trade count at all, so this and the statistical checks are
      complementary, not overlapping.

  - id: profit_factor_floor
    source: "vinu-agent/skills/backtest-diagnose/SKILL.md (hard-gate checklist)"
    check: "profit_factor > 1.5"
    severity: hard
    reason: "Reused from backtest-diagnose — do not restate a different threshold here."

  - id: drawdown_ratio
    source: "vinu-agent/skills/backtest-diagnose/SKILL.md (hard-gate checklist)"
    check: "oos_max_dd < 1.5 * is_max_dd"
    severity: hard
    reason: "Reused from backtest-diagnose."

  - id: is_oos_sharpe_floor
    source: "vinu-agent/skills/backtest-diagnose/SKILL.md (hard-gate checklist)"
    check: "is_sharpe > 1.0 and oos_sharpe > 0.7"
    severity: hard
    reason: >
      Reused from backtest-diagnose AS-IS. Flagged unresolved tension:
      loop.py::_rule_based_check (the actual running risk critic) treats
      "sharpe < 0.5" as a soft suggestion, not a hard rejection — these
      two real pieces of the codebase disagree with each other. Do not
      silently pick a winner; surface the tension if an agent hits a
      result that would pass one and fail the other.

  - id: overfitting_selection_risk
    source: "vinu_research/pbo.py::probability_of_backtest_overfitting"
    check: "pbo < 0.70"
    severity: soft
    reason: >
      PBO judges the SELECTION PROCESS across multiple candidates in one
      run, not one candidate's own validity — a high PBO lowers
      confidence in "the best one" without invalidating it outright.
      Known gap: PBO is only available in the live run() response, not
      persisted to research_runs — cannot be checked after the fact yet.

  - id: correlation_with_active
    source: "vinu_research/gates/correlation_gate.py::CorrelationVerdict"
    check: "correlation_verdict.eligible == true"
    severity: soft
    reason: >
      Soft at candidate-evaluation time — a correlated candidate can still
      be individually valid; correlation only becomes a hard concern once
      deciding whether to add it alongside what's already ACTIVE (see
      promotion_evaluation below). Note this gate fails OPEN (eligible=True
      by default when no active strategies or insufficient data) — the
      opposite default from statistical_validation above.

promotion_evaluation:
  # Applied once, when deciding whether a BENCHING artifact should become
  # ACTIVE (trusted with live capital). A separate, later, stricter
  # decision from candidate_evaluation above — do not conflate the two.

  - id: promotion_bar
    source: "vinu_research/promotion.py::meets_promotion_bar -> PromotionVerdict"
    check: "promotion_verdict.eligible == true"
    severity: hard
    reason: >
      Combines deflated_sharpe (multiple-comparisons-corrected) vs. a
      configured threshold, the true out-of-sample holdout result, an
      optional stress test, and the correlation gate above (hard here,
      unlike at candidate-evaluation time). This is the live-capital gate
      — by definition hard.
    approximate_without_side_effects: >
      GET /research/artifacts already returns deflated_sharpe,
      holdout_passed, stress_test_passed per artifact — an agent can
      approximate this check by comparing those three fields to the same
      thresholds meets_promotion_bar uses, without triggering the actual
      POST /research/artifacts/{id}/promote call (which mutates state to
      ACTIVE on success). This approximation cannot include the
      correlation piece — that route doesn't return it.
