agent_tools:
  add_hypothesis_evidence:
    name: add_hypothesis_evidence
    description: Record what actually happened against a previously-created hypothesis (via create_hypothesis)
      — the outcome, whether it supported or contradicted the expectation, and why. This is what makes
      a past expectation checkable later.
    parameters:
      hypothesis_id:
        type: string
        description: From a prior create_hypothesis call
      metric:
        type: string
        description: Which metric this evidence is about, e.g. 'sharpe'
      value:
        type: number
        description: The observed value of that metric
      conclusion:
        type: string
        description: '''supports'' or ''contradicts'' the hypothesis'
      reasoning:
        type: string
        description: Why this outcome supports/contradicts the expectation (optional)
      run_id:
        type: integer
        description: Associated research run id, if any (optional)
      iteration:
        type: integer
        description: Associated iteration/round number, if any (optional)
    is_readonly: false
    module: vinu_agent.tools.hypothesis_write_tools
  cancel_order:
    name: cancel_order
    description: Cancel an open order by its order ID
    parameters:
      order_id:
        type: string
        description: The order ID to cancel
    is_readonly: false
    module: vinu_agent.tools.trade_tool
  check_symbol_research_state:
    name: check_symbol_research_state
    description: Check whether a symbol has been marked exhausted (too many failed research trials without
      a passing strategy) and see its cross-run trial history (lifetime trial count, best Sharpe ever
      achieved). Use this before starting a new research run on a symbol — if it's exhausted, a new run
      will return early without doing real work.
    parameters:
      symbol:
        type: string
        description: Stock symbol
    is_readonly: true
    module: vinu_agent.tools.symbol_research_state_tool
  compact:
    name: compact
    description: Explicitly compact the conversation context. Use when the conversation history is long
      (near context window limits) to preserve key information while reducing token usage.
    parameters:
      type: object
      properties: {}
      required: []
    is_readonly: true
    module: vinu_agent.tools.compact_tool
  compare_portfolio:
    name: compare_portfolio
    description: Compare current live/paper positions and P&L against each strategy's backtest expectations
    parameters:
      format:
        type: string
        description: 'Output format: ''text'' for human-readable, ''json'' for raw data'
        enum:
        - text
        - json
    is_readonly: true
    module: vinu_agent.tools.portfolio_comparison_tool
  create_hypothesis:
    name: create_hypothesis
    description: Record an expectation/reasoning BEFORE seeing a result — e.g. before running a coarse
      pass or a widen/narrow decision in a parameter sweep. Returns a hypothesis_id; pass it to add_hypothesis_evidence
      once the result is in, so 'was this expectation correct' is checkable afterward via query_hypotheses.
    parameters:
      title:
        type: string
        description: Short label for this expectation
      thesis:
        type: string
        description: The actual expectation/reasoning, in prose
      symbol:
        type: string
        description: Primary ticker this hypothesis is about (optional)
      strategy_type:
        type: string
        description: Strategy/recipe this hypothesis concerns (optional)
    is_readonly: false
    module: vinu_agent.tools.hypothesis_write_tools
  factor_analysis:
    name: factor_analysis
    description: 'Analyze and select alpha factors from the factor zoo (461 factors across 5 families).

      Supports listing themes, filtering factors by attributes, and getting detailed info about a specific
      factor.

      Use this to find the right factors for a given trading strategy or market regime.'
    parameters:
      type: object
      properties:
        action:
          type: string
          description: Action to perform
          enum:
          - list_themes
          - filter
          - describe
          - list_zoos
          - count
        theme:
          type: string
          description: Factor theme to filter by (e.g. momentum, reversal, volatility, volume, microstructure)
        zoo:
          type: string
          description: Factor family to filter by (alpha101, gtja191, qlib158, academic, fundamental)
        universe:
          type: string
          description: Target universe (equity_us, equity_cn, equity_hk, equity_in)
        alpha_id:
          type: string
          description: Specific factor ID to describe (e.g. alpha101_001, gtja191_005)
        limit:
          type: integer
          description: Max results to return (default 20, max 100)
      required:
      - action
    is_readonly: true
    module: vinu_agent.tools.factor_analysis_tool
  factor_backtest:
    name: factor_backtest
    description: 'Run a backtest simulation for one or more alpha factors.

      Accepts factor expressions (e.g. "alpha101_001 + rank(gtja191_005)") or factor IDs,

      builds long/short portfolios, and returns performance metrics (Sharpe, Sortino,

      max drawdown, win rate, profit factor).'
    parameters:
      type: object
      properties:
        factor:
          type: string
          description: Factor expression or alpha ID to backtest. E.g. 'alpha101_001', 'qlib158_ma5 +
            rank(gtja191_005)', 'ts_mean(alpha101_001, 10)'
        weight_scheme:
          type: string
          description: Portfolio weighting method
          enum:
          - equal
          - rank
          - vol_parity
          - top_quantile
        long_quantile:
          type: number
          description: Top fraction to go long (default 0.2 = top 20%)
        freq:
          type: string
          description: Data frequency for annualization
          enum:
          - 1d
          - 1h
          - 1w
          - 1mo
        symbols:
          type: string
          description: Comma-separated symbols to use (optional, uses random universe if omitted)
        start_date:
          type: string
          description: Start date YYYY-MM-DD (optional)
        end_date:
          type: string
          description: End date YYYY-MM-DD (optional)
      required:
      - factor
    is_readonly: true
    module: vinu_agent.tools.factor_backtest_tool
  generate_trade_plan:
    name: generate_trade_plan
    description: 'Generate a granular, staged trading plan document for a symbol: entry checklist (long
      and short), profit-booking tranches, and invalidation/exit rules. Uses existing analysis angles,
      quantitative factors, backtest validation, news sentiment, and market regime data — no broker execution.'
    parameters:
      symbol:
        type: string
        description: Stock symbol
      timeframe:
        type: string
        description: Trading timeframe
        enum:
        - intraday
        - daily
        - swing
      preset:
        type: string
        description: Feature preset recipe (optional, defaults to timeframe-appropriate preset)
      days:
        type: integer
        description: Lookback days for analysis (optional, defaults to 365)
    is_readonly: true
    module: vinu_agent.tools.trade_plan_tool
  get_backtest_validation:
    name: get_backtest_validation
    description: Read the full statistical validation verdict for a specific backtest result — Monte Carlo
      permutation p-value, block bootstrap, price-path resample, walk-forward consistency, bootstrap CI,
      BCa CI, and placebo test, combined into an overall pass/fail with reasons. This is the real, already-computed
      statistical evidence for whether a result is trustworthy, not just its top-line Sharpe/drawdown.
      Use the backtest's run_id (a string, distinct from a research run's integer id) from a prior simulate/research
      call.
    parameters:
      run_id:
        type: string
        description: Backtest run ID (from a simulate or research call's result)
    is_readonly: true
    module: vinu_agent.tools.backtest_validation_tool
  get_correlation:
    name: get_correlation
    description: Compute news-price correlation analysis for a symbol
    parameters:
      symbol:
        type: string
        description: Stock symbol
      start_date:
        type: string
        description: Start date YYYY-MM-DD
      end_date:
        type: string
        description: End date YYYY-MM-DD
    is_readonly: true
    module: vinu_agent.tools.correlation_tool
  get_features:
    name: get_features
    description: Compute technical indicators (SMA, RSI, MACD, etc.) for a symbol over a date range
    parameters:
      symbol:
        type: string
        description: Stock symbol
      indicators:
        type: string
        description: Comma-separated indicator names (e.g., sma_20,rsi_14,macd)
      start_date:
        type: string
        description: Start date YYYY-MM-DD
      end_date:
        type: string
        description: End date YYYY-MM-DD
    is_readonly: true
    module: vinu_agent.tools.features_tool
  get_fundamentals:
    name: get_fundamentals
    description: 'Fetch fundamental data for a symbol: financial ratios, income statement summary, balance
      sheet, and valuation metrics'
    parameters:
      symbol:
        type: string
        description: Stock symbol (e.g., AAPL)
      metric:
        type: string
        description: 'Metric type: summary, income, balance, cashflow, ratios, all (default: summary)'
        enum:
        - summary
        - income
        - balance
        - cashflow
        - ratios
        - all
    is_readonly: true
    module: vinu_agent.tools.fundamentals_tool
  get_news:
    name: get_news
    description: Fetch news articles for a symbol over a date range
    parameters:
      symbol:
        type: string
        description: Stock symbol
      start_date:
        type: string
        description: Start date YYYY-MM-DD
      end_date:
        type: string
        description: End date YYYY-MM-DD
      limit:
        type: integer
        description: 'Max articles to return (default: 20)'
    is_readonly: true
    module: vinu_agent.tools.news_tool
  get_portfolio:
    name: get_portfolio
    description: 'Fetch the current Alpaca paper trading portfolio: account summary, open positions, and
      pending orders'
    parameters:
      section:
        type: string
        description: 'Which section to fetch: account, positions, orders, or all (default: all)'
        enum:
        - account
        - positions
        - orders
        - all
    is_readonly: true
    module: vinu_agent.tools.portfolio_tool
  get_run_checkpoints:
    name: get_run_checkpoints
    description: 'Read iteration checkpoints saved during a research run — each iteration''s strategy
      code, metrics, and critic verdict at the time it ran. Use latest_only=true to resume from where
      a previous run left off instead of starting a new search from scratch. Note: as of this tool''s
      introduction, checkpoints are saved every iteration but nothing automatically resumes from them
      — resuming is a decision the caller makes explicitly using this data.'
    parameters:
      run_id:
        type: integer
        description: Research run ID (from run_research's response or list_runs)
      latest_only:
        type: boolean
        description: Return only the most recent checkpoint instead of the full list (optional, default
          false)
    is_readonly: true
    module: vinu_agent.tools.run_checkpoints_tool
  get_stock_price:
    name: get_stock_price
    description: Fetch historical OHLCV price data for a symbol
    parameters:
      symbol:
        type: string
        description: Stock symbol
      start_date:
        type: string
        description: Start date YYYY-MM-DD
      end_date:
        type: string
        description: End date YYYY-MM-DD
      interval:
        type: string
        description: 'Bar interval: 1m, 5m, 15m, 1h, 1D (default: 1D)'
    is_readonly: true
    module: vinu_agent.tools.stock_price_tool
  list_sweep_recipes:
    name: list_sweep_recipes
    description: List built-in strategy recipes available for run_sweep_candidate's recipe mode, each
      with its tunable parameter names and default values. Read this before picking a recipe + params.
    parameters: {}
    is_readonly: true
    module: vinu_agent.tools.run_sweep_candidate_tool
  load_skill:
    name: load_skill
    description: Load full documentation for a specialized research skill or methodology
    parameters:
      name:
        type: string
        description: Skill name (e.g., strategy-generate, research-discipline)
    is_readonly: true
    module: vinu_agent.tools.load_skill_tool
  query_hypotheses:
    name: query_hypotheses
    description: Read recorded research hypotheses and their evidence trail — what was expected before
      a backtest ran, what the outcome was, and whether it supported or contradicted the hypothesis. Backed
      by the same registry the research loop already writes to during every research run; use this before
      starting new research on a symbol to see what's already been tried and concluded.
    parameters:
      symbol:
        type: string
        description: Filter to hypotheses whose universe includes this ticker (optional — omit to list
          all)
      status:
        type: string
        description: 'Filter by status: exploring|testing|validated|rejected|monitoring|mc_gate_failed
          (optional)'
    is_readonly: true
    module: vinu_agent.tools.query_hypotheses_tool
  query_memory:
    name: query_memory
    description: Search the unified agent memory across research runs, simulation results, price data,
      news articles, and stored findings. Use this to recall what the agent already knows about a symbol
      before starting new work.
    parameters:
      query:
        type: string
        description: Search text (can be a symbol, concept, or question)
      symbol:
        type: string
        description: Filter by stock symbol (optional)
      source:
        type: string
        description: 'Filter by source: research, simulator, stock_price, news, agent (optional)'
        enum:
        - ''
        - research
        - simulator
        - stock_price
        - news
        - agent
      memory_type:
        type: string
        description: 'Filter by type: research_run, strategy_artifact, simulation_run, price_summary,
          news_article, finding (optional)'
      limit:
        type: integer
        description: 'Max results to return (default: 15, max: 50)'
    is_readonly: true
    module: vinu_agent.tools.query_memory_tool
  remember:
    name: remember
    description: Save an important finding or data point to persistent cross-session memory
    parameters:
      name:
        type: string
        description: A short unique name for this memory (e.g., aapl-momentum-decay)
      content:
        type: string
        description: The finding or data to remember
      symbol:
        type: string
        description: Stock symbol this memory relates to (optional)
      memory_type:
        type: string
        description: 'Type: finding, strategy, config, user_pref (default: finding)'
    is_readonly: false
    module: vinu_agent.tools.remember_tool
  run_backtest:
    name: run_backtest
    description: Run a backtest for a trading strategy. The strategy_code must define a class Strategy
      with a generate_weights(self, data) -> pd.Series method. Returns metrics (sharpe, max_drawdown,
      total_return) and trade count.
    parameters:
      strategy_code:
        type: string
        description: Python code defining a Strategy class with generate_weights method
      symbol:
        type: string
        description: Stock symbol (e.g., AAPL, 600519.SH, BTC-USDT)
      start_date:
        type: string
        description: Start date in YYYY-MM-DD format
      end_date:
        type: string
        description: End date in YYYY-MM-DD format
      interval:
        type: string
        description: 'Bar interval: 1m, 5m, 15m, 1h, 1D (default: 1D)'
      initial_capital:
        type: number
        description: 'Starting capital in USD (default: 100000)'
    is_readonly: false
    module: vinu_agent.tools.backtest_tool
  run_research:
    name: run_research
    description: 'Run the full multi-iteration research loop for a trading idea: generates candidate strategy
      code, backtests it, applies a risk critic, and refines until PASS/STOP/max-iterations. Use dry_run=true
      first for a cheap sanity check before committing to a full run.'
    parameters:
      idea:
        type: string
        description: Research hypothesis or trading idea
      symbol:
        type: string
        description: Stock symbol
      from_date:
        type: string
        description: Start date YYYY-MM-DD
      to_date:
        type: string
        description: End date YYYY-MM-DD
      indicators:
        type: string
        description: Comma-separated indicator kinds to make available, e.g. 'sma_20,rsi_14' (optional)
      initial_capital:
        type: number
        description: Starting capital for the backtest (optional, defaults to service config)
      universe:
        type: string
        description: Comma-separated tickers to backtest as a portfolio alongside symbol, e.g. 'MSFT,GOOGL'
          (optional)
      dry_run:
        type: boolean
        description: If true, validate inputs and return without running the full loop (optional, default
          false)
    is_readonly: false
    module: vinu_agent.tools.research_tool
  run_strategy:
    name: run_strategy
    description: Evaluate a YAML-defined strategy from the strategy service
    parameters:
      strategy_name:
        type: string
        description: Name of the registered strategy
      symbol:
        type: string
        description: Stock symbol
      date:
        type: string
        description: Evaluation date YYYY-MM-DD
    is_readonly: false
    module: vinu_agent.tools.strategy_tool
  run_sweep_candidate:
    name: run_sweep_candidate
    description: 'Run ONE backtest of a strategy at ONE specific set of numeric parameter values (e.g.
      SMA period=9, RSI threshold=25) and return the full result including the statistical validation
      block. This tool does not decide which values to try or when to stop — that adaptive reasoning is
      the caller''s job, calling this repeatedly round by round. Two modes: (1) recipe mode — pass `recipe`
      (see list_sweep_recipes) and `params` as a JSON object with the full parameter set for this candidate.
      (2) base_code mode — pass `base_code` (an existing strategy''s full source, e.g. from a prior iteration)
      plus `param_name`/`param_value` to vary exactly one already-present numeric parameter in it.'
    parameters:
      symbol:
        type: string
        description: Stock symbol
      from_date:
        type: string
        description: Start date YYYY-MM-DD
      to_date:
        type: string
        description: End date YYYY-MM-DD
      recipe:
        type: string
        description: 'Recipe-mode: a built-in strategy template key (see list_sweep_recipes). Requires
          `params`.'
      params:
        type: string
        description: 'Recipe-mode: JSON object of the full parameter set for this candidate, e.g. ''{"fast_period":
          9, "slow_period": 40}'''
      base_code:
        type: string
        description: 'Base-code-mode: existing strategy source to vary one parameter of. Requires `param_name`/`param_value`.'
      param_name:
        type: string
        description: 'Base-code-mode: the parameter name to vary'
      param_value:
        type: number
        description: 'Base-code-mode: the new value for param_name'
      indicators:
        type: string
        description: Comma-separated indicator kinds to make available, e.g. 'sma_20,rsi_14' (optional)
      initial_capital:
        type: number
        description: Starting capital for the backtest (optional, defaults to service config)
    is_readonly: false
    module: vinu_agent.tools.run_sweep_candidate_tool
  search_sessions:
    name: search_sessions
    description: Search across all past conversation sessions using full-text search
    parameters:
      query:
        type: string
        description: Search query text
    is_readonly: true
    module: vinu_agent.tools.session_search_tool
  submit_order:
    name: submit_order
    description: Submit a trade order to Alpaca paper trading. Every order is validated against the trading
      mandate before execution.
    parameters:
      symbol:
        type: string
        description: Ticker symbol (e.g., AAPL)
      qty:
        type: number
        description: Number of shares
      side:
        type: string
        description: Order side
        enum:
        - buy
        - sell
      order_type:
        type: string
        description: 'Order type (default: market)'
        enum:
        - market
        - limit
        - stop
        - stop_limit
      limit_price:
        type: number
        description: Limit price (required for limit/stop_limit orders)
      stop_price:
        type: number
        description: Stop price (required for stop/stop_limit orders)
      time_in_force:
        type: string
        description: 'Time in force (default: day)'
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
      take_profit_price:
        type: number
        description: Optional profit-target exit price. With stop_loss_price, attaches a real bracket
          order at entry so the exit is a resting order, not a manual follow-up.
      stop_loss_price:
        type: number
        description: Optional stop-loss trigger price. Attaches a real stop order at entry so the exit
          is a resting order, not a manual follow-up.
      stop_loss_limit_price:
        type: number
        description: Optional limit price for the stop-loss leg (stop-limit instead of stop-market). Only
          used if stop_loss_price is set.
    is_readonly: false
    module: vinu_agent.tools.trade_tool
  web_search:
    name: web_search
    description: Search the web for current information on a query
    parameters:
      query:
        type: string
        description: Search query
    is_readonly: true
    module: vinu_agent.tools.web_search_tool
services:
  vinu_simulator:
    port: 8085
    config_key: VINU_SIMULATOR_API_URL
    purpose: 'Runs backtests (named-strategy and custom Python code) and computes the full statistical
      validation suite (Monte Carlo permutation, block bootstrap, price-path resample, bootstrap/BCa Sharpe
      CI, placebo test, walk-forward consistency) automatically on every run.

      '
    key_endpoints:
    - POST /simulate — backtest a named vinu-strategy strategy
    - POST /simulate/custom — backtest arbitrary Python strategy code
    - GET /results/{run_id} — full result incl. validation block
    - GET /results/{run_id}/metrics — metrics only, no validation
  vinu_research:
    port: 8087
    config_key: VINU_RESEARCH_API_URL
    purpose: 'The multi-iteration research loop (generate -> backtest -> risk critic -> refine), hypothesis/evidence
      tracking, PBO, correlation gate, promotion bar (BENCHING->ACTIVE), and the parameter-sweep engine
      (Step 06/07 of the implementation plan).

      '
    key_endpoints:
    - POST /research/run — full research loop for a symbol/idea
    - GET /research/artifacts — list strategy artifacts by status
    - POST /research/artifacts/{id}/promote — BENCHING -> ACTIVE
    - GET /research/hypotheses, POST /research/hypotheses, POST /research/hypotheses/{id}/evidence
    - GET /research/symbols/{symbol}/state — exhaustion + catalog
    - GET /research/runs/{id}/checkpoints — iteration checkpoints
    - POST /research/sweep/candidate, GET /research/sweep/recipes
  vinu_portfolio:
    port: 8090
    config_key: VINU_PORTFOLIO_API_URL
    purpose: 'Portfolio construction (risk-parity allocation off a correlation matrix — build_portfolio()
      is currently a stateless calculation, no regime-awareness or outcome memory, see Step 10 of the
      plan) and the live drawdown circuit breaker (PortfolioDrawdownMonitor + drawdown_scheduler.py —
      genuinely running, halts via vinu-agent''s /broker/halt on -20% portfolio drawdown, see the live-safety
      skill).

      '
    key_endpoints:
    - GET /portfolio — current allocation
    - (drawdown monitor runs as its own background process, not an HTTP endpoint — see vinu-portfolio/entrypoint.sh)
  vinu_strategy:
    port: 8084
    config_key: VINU_STRATEGY_API_URL
    purpose: 'Registry of declarative rule-based trading strategies (pipeline: selection/allocation/timing/risk
      stages over indicator features and angle/correlation signals) — a different execution format from
      vinu-research''s Python-code strategies. Only 4 real strategies registered as of this catalog''s
      last check: ma_crossover, adx_filtered_crossover, rsi_mean_reversion, news_aware_momentum (tagged
      with regime/style in the strategy-tags skill).

      '
    key_endpoints:
    - GET /strategies — list (reads a separate SQLite table, NOT the YAML registry directly — known inconsistency,
      see strategy-tags/SKILL.md)
    - GET /strategies/{name} — detail (this one DOES read the YAML registry)
    - GET /weights — computed strategy weights
  vinu_initial_analysis:
    port: 8083
    config_key: VINU_INITIAL_ANALYSIS_API_URL
    purpose: 'Computes the 11 analysis "angles" (regime, trend_lifecycle, news_causality, session_structure,
      ...) via AngleRunner — already systematic execution; the gap this project''s Focus 2 originally
      identified was the agent not consuming these outputs, not that they don''t exist.

      '
    key_endpoints:
    - (see vinu_initial_analysis/runner.py::AngleRunner and its own routes — not independently re-verified
      for this catalog entry; treat as needing a fresh check before depending on exact paths)
  vinu_news:
    port: 8080
    config_key: VINU_NEWS_API_URL
    purpose: 'Full news pipeline: RSS ingestion, LLM enrichment (sentiment, threat, priority, category,
      ticker extraction/dominance, price_reaction), dedup, storage with its own FTS index (separate from
      vinu-research''s storage).

      '
    key_endpoints:
    - GET /latest, GET /ticker/{symbol}, GET /watchlist/news, GET /search, GET /poll/status
  vinu_stock_price:
    port: 8081
    config_key: VINU_STOCK_PRICE_API_URL
    purpose: Price/candle data — not independently re-verified for this catalog beyond its config entry;
      check its own routes before depending on exact paths.
    key_endpoints: []
  vinu_tools:
    port: 8082
    config_key: VINU_TOOLS_API_URL
    purpose: 'Unrelated compute/feature-engineering service (indicators, operators, risk calcs, Alpha101/191/academic/fundamental
      factors, ML pipeline). Not "a tool catalog for vinu-* services" despite the name — that mistake
      was made once already earlier in this project''s planning and corrected. Its own scripts/generate_yaml_catalog.py
      is the precedent this catalog''s generation script follows.

      '
    key_endpoints:
    - (feature/factor computation endpoints — see vinu-tools' own server/routes for exact paths)
  vinu_live:
    port: null
    config_key: null
    purpose: 'Live trading operations: position book, circuit breaker (its own, separate from vinu-portfolio''s),
      trade-plan orchestrator, feedback loop (writes realized outcomes back into research calibration
      state), and ShadowEvaluator (paper-trading BENCHING-> ACTIVE promotion — built, real, but confirmed
      NOT invoked by anything as of the live-safety skill''s last check; also has no test file). NOT currently
      in vinu-agent''s services config dict — no existing agent tool calls into vinu-live directly.

      '
    key_endpoints:
    - (not currently reachable from any vinu-agent tool — see live-safety/SKILL.md before assuming otherwise)
