angles:
- id: arima
  title: ARIMA Classical Statistical Baseline
  purpose: 'AutoRegressive Integrated Moving Average forecast — the classical statistical
    baseline (method 25 of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/25-arima.md).
    Fits an ARIMA(p, d, q) model to the close-price series with order chosen by AIC
    grid search, no fixed lookback window, and reports the model''s standard output
    shape: a one-step-ahead point forecast plus its 95% confidence interval.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Fitted ARIMA order, AIC, one-step-ahead point forecast, and 95%
      confidence interval

      '
- id: backtesting_44_metrics
  title: Backtesting Metrics
  purpose: Compute 44+ portfolio metrics — Sharpe, Sortino, MaxDD, WinRate, CAGR,
    VaR, CVaR, tail ratio
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  - 1W
  - 1M
  - 6M
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: chronos
  title: Chronos Time-Series Foundation Model
  purpose: 'Zero-shot probabilistic forecast from Amazon''s Chronos-T5 time-series
    foundation model (method 10 of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/10-chronos.md).
    General-purpose, not finance-specific — a comparison baseline against Kronos,
    not a first-choice signal (per the spec''s own caveat that general TSFMs tend
    to underperform finance-specific models on K-line data).

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Quantile forecast (p10/median/p90) for the next 5 periods, plus
      model_backend ("pretrained" via amazon/chronos-t5-large, or "fallback_proxy"
      if the real pipeline could not be loaded).

      '
- id: cross_attention_gcn_news_price_fusion
  title: Bidirectional Cross-Attention + GCN News-Price Fusion
  purpose: 'News+price fusion via real bidirectional cross-attention (method 29, see
    New-talk-/Final-implementation/01-present-considerations/ 29-cross-attention-gcn-news-price-fusion.md).
    The cross-attention layer is a genuine small PyTorch module; the GCN''s cross-stock
    layer is structurally degenerate here (single-node self-loop) since compute()
    is called per single symbol, not jointly across tickers — see compute.py''s module
    docstring and the gcn_note output field.

    '
  time_formats:
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Predicted next-period return/close from the fused price+news representation,
      plus model_backend ("trained_in_process"), gcn_note explaining the single-ticker
      degeneration, and n_news_articles_used.

      '
- id: dlinear
  title: DLinear Decomposition Linear Forecast
  purpose: 'Trained-from-scratch DLinear model (method 18 of the 32-method plan, see
    New-talk-/Final-implementation/01-present-considerations/18-dlinear.md) — the
    simplest of six architectures the source survey found "actually win on finance".
    Decomposes the close-price window into a moving-average trend and a seasonal residual,
    fits one small linear layer to each on a handful of Adam epochs at request time,
    and sums their outputs into a one-step-ahead point forecast, thresholded to a
    direction.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead forecast price/return, thresholded direction (up/down/flat),
      and the fit''s training-window count and final training loss.

      '
- id: drawdown_deep_dive
  title: Drawdown Deep-Dive
  purpose: Drawdown detection, news attribution, max drawdown duration, recovery time
    across multi-timeframe
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: exponential_smoothing
  title: Exponential Smoothing Classical Baseline
  purpose: 'Double exponential smoothing (Holt''s linear trend method) forecast —
    the classical, essentially-free statistical baseline (method 28 of the 32-method
    plan, see New-talk-/Final-implementation/01-present-considerations/28-exponential-smoothing.md).
    Weights recent close-price observations more heavily than older ones via an exponentially-decaying
    scheme, fitting a level + trend decomposition (no seasonal component — daily-bar
    equity series have no reliable fixed seasonal period) and reporting the one-step-ahead
    point forecast alongside the fitted level/trend components.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead point forecast, fitted smoothing parameters (alpha,
      beta), and level/trend decomposition

      '
- id: garch
  title: GARCH Volatility Forecast
  purpose: 'Standalone GARCH(1,1) conditional-variance forecast — the classical, zero-footprint
    volatility baseline (method 26 of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/26-garch.md).
    Extracted from shock_personality, which already fits GARCH internally for its
    own vol_persistence field (via vinu_tools.compute.risk.volatility .garch_volatility)
    — this angle exposes the same underlying fit as its own first-class result rather
    than duplicating the math.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Forecasted next-period volatility plus fitted GARCH(1,1) parameters
- id: itransformer
  title: iTransformer Cross-Variate Attention Forecast
  purpose: 'Trained-from-scratch iTransformer model (method 21 of the 32-method plan,
    see New-talk-/Final-implementation/01-present-considerations/21-itransformer.md)
    — tokenizes variates (here: this symbol''s OHLCV channels, since the per-symbol
    compute() interface has no sibling-ticker input to exploit true cross-asset attention;
    see compute.py''s docstring for the full deviation note) rather than time steps,
    so self-attention runs across variate-tokens. Fit via a handful of Adam epochs
    at request time; reports the close-channel one-step forecast, thresholded to a
    direction.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead forecast for every OHLCV channel used as a variate
      (forecast_open/high/low/close/volume), close-channel return thresholded to a
      direction (up/down/flat), which channels were used, and the fit''s training-window
      count and final training loss.

      '
- id: kalman_filters
  title: Kalman Filter State Estimation
  purpose: 'Classical recursive state-estimation baseline (method 27 of the 32-method
    plan, see New-talk-/Final-implementation/01-present-considerations/27-kalman-filters.md).
    Recursively estimates a hidden underlying price level and local trend from noisy
    close-price observations via a predict-then-correct cycle (statsmodels'' local-linear-trend
    structural time series model — a two-state Kalman filter/smoother). Reports the
    present/recent filtered and smoothed state plus its uncertainty (state covariance)
    — not a forward forecast.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Filtered and smoothed level/trend state estimates plus their standard
      deviations (state covariance uncertainty)

      '
- id: kronos
  title: Kronos Financial K-Line Foundation Model
  purpose: 'Next-K-line forecast using the real Kronos pretrained model (method 9
    of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/09-kronos.md)
    — the flagship open-source financial K-line foundation model (AAAI 2026), a tokenizer
    + autoregressive decoder-only transformer pretrained on 12B K-line records from
    45 exchanges. Weights + tokenizer are downloaded into the shared models dir (`make
    models`); the custom model code is vendored (MIT) into `_kronos_model/`. Falls
    back to an honestly-labeled in-process-trained MLP proxy only if the weights or
    load are unavailable at runtime. See compute.py''s module docstring for the full
    explanation.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Predicted next-bar OHLC plus a 5-step OHLC forecast, model_backend
      ("pretrained" or "fallback_proxy") and fallback_reason explaining why.

      '
- id: lag_llama
  title: Lag-Llama Probabilistic Time-Series Model (fallback proxy)
  purpose: 'Probabilistic (multi-quantile) forecast in the spirit of Lag-Llama (method
    16 of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/16-lag-llama.md).
    lag-llama has no PyPI package and only a manual-clone research repo — this angle
    uses an honestly-labeled AR(5) linear-Gaussian fallback proxy that still emits
    a genuinely probabilistic output. See compute.py''s module docstring.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Point forecast plus a 5-quantile (p5/p25/p50/p75/p95) distributional
      forecast for the next 5 periods, plus model_backend (always "fallback_proxy")
      and fallback_reason.

      '
- id: lpatchtst
  title: LPatchTST LSTM+PatchTST Hybrid Forecast
  purpose: 'Trained-from-scratch LPatchTST model (method 23 of the 32-method plan,
    see New-talk-/Final-implementation/01-present-considerations/23-lpatchtst.md)
    — the best-performing of the six trained-from-scratch architectures in the source
    survey (57.7% directional accuracy per arXiv:2603.01820, corrected from an earlier
    miscited ~54% — see 04-enhancement-of-each-angle/13-lpatchtst.md SS1 for the correction;
    Sharpe 2.31-2.32). "L" is LSTM, not "lightweight": an LSTM branch and a patch-transformer
    branch (the same `PatchEncoderBranch` used standalone by `patchtst`) each encode
    the close-price lookback window, their representations are concatenated, and one
    linear head produces the one-step point forecast.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead forecast price/return, thresholded direction (up/down/flat),
      LSTM/patch branch configuration, and the fit''s training-window count and final
      training loss.

      '
- id: lstm
  title: LSTM Sequential Forecast
  purpose: 'Trained-from-scratch single-layer LSTM (method 19 of the 32-method plan,
    see New-talk-/Final-implementation/01-present-considerations/19-lstm.md) — the
    classical recurrent baseline among the six trained-from-scratch architectures
    the source survey found competitive on finance. Processes a rolling close-price
    window step-by-step through gated memory cells, fit via a handful of Adam epochs
    at request time, producing a one-step point forecast thresholded to a direction.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead forecast price/return, thresholded direction (up/down/flat),
      and the fit''s training-window count and final training loss.

      '
- id: ml_model_pipeline
  title: ML Model Pipeline
  purpose: Train/evaluate 9 ML models, OOS IC, auto-selection, CUDA detection
  time_formats:
  - 1D
  - 1W
  - 1M
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: moirai
  title: MOIRAI Any-Variate Time-Series Foundation Model (fallback proxy)
  purpose: 'Forecast in the spirit of Salesforce''s MOIRAI (method 13 of the 32-method
    plan, see New-talk-/Final-implementation/01-present-considerations/13-moirai.md).
    The real `uni2ts` package exists but would downgrade the shared environment''s
    torch build and can''t exercise MOIRAI''s any-variate multi-ticker mechanism from
    this per-symbol interface anyway — this angle uses an honestly-labeled AR(3) statistical
    fallback proxy. See compute.py''s module docstring.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Point + p10/p90 forecast for the next 5 periods, plus model_backend
      (always "fallback_proxy"), fallback_reason, and any_variate_note explaining
      the single-ticker degeneration.

      '
- id: moment
  title: MOMENT Multi-Task Time-Series Foundation Model (fallback proxy)
  purpose: 'Forecast in the spirit of MOMENT''s forecasting task (method 14 of the
    32-method plan, see New-talk-/Final-implementation/01-present-considerations/14-moment.md).
    The real `momentfm` package failed to build in this Python 3.12 environment (pkgutil.ImpImporter
    incompatibility, confirmed via an actual install attempt) — this angle uses an
    honestly-labeled statistical fallback proxy for the forecasting task only. See
    compute.py''s module docstring.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Point + p10/p90 forecast for the next 5 periods, plus model_backend
      (always "fallback_proxy"), fallback_reason, and task_note flagging that only
      the forecasting task is implemented.

      '
- id: news_first_analysis
  title: News First Analysis
  purpose: Categorize and quantify the news landscape — sentiment, categories, priority,
    threads, and basic stats
  time_formats:
  - 15min
  - 1H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: news_price_causality
  title: News-Price Causality
  purpose: Statistical proof of news impact on price — Granger causality, Pearson
    correlation, lag analysis, event study
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: patchtst
  title: PatchTST Channel-Independent Patch Transformer
  purpose: 'Trained-from-scratch PatchTST model (method 20 of the 32-method plan,
    see New-talk-/Final-implementation/01-present-considerations/20-patchtst.md) —
    splits the close-price lookback window into fixed-length patches, embeds each
    as a token, and runs a small transformer encoder''s self-attention across patches
    (channel-independent design, a regularizer per the source survey). Fit via a handful
    of Adam epochs at request time; produces a one-step point forecast thresholded
    to a direction. See `lpatchtst` for the LSTM+PatchTST hybrid built on the same
    shared patch-encoder core.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead forecast price/return, thresholded direction (up/down/flat),
      patch configuration, and the fit''s training-window count and final training
      loss.

      '
- id: peer_relative_strength
  title: Peer Relative Strength
  purpose: 'Measures how a symbol performs relative to its watchlist peer basket over
    time using rolling correlation and relative (excess) returns. Stands apart from
    shock_clustering (which only answers "which symbols shock together on shock dates")
    by computing peer co-movement and relative strength as a continuous, windowed
    signal across the full requested range.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
    price_client: price_client | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Rolling peer correlation and excess-return rows per sampled bar:
      date, peer_symbol, correlation (63-day rolling), relative_return_20d.'
- id: pnl_attribution
  title: PnL Attribution
  purpose: 'Realized-trade PnL statistics per symbol -- win rate, average win/loss,
    trade count -- computed from Phase 6 (vinu-live) execution logs. Every field includes
    sample size and confidence interval. Deviates from the standard runner-driven
    angle pattern: its natural input is closed positions/fills, not price bars, so
    it is push-fed via POST /pnl-attribution/{symbol}/record (Phase 7''s feedback
    loop) rather than pulled by AngleRunner from bars/news. `compute()` still exists
    with the standard signature so a generic `/run/{ticker}` sweep doesn''t error,
    but it is a documented no-op there -- real population happens through the ingest
    path (`pnl_attribution_ingest.py`), which calls `aggregate_pnl_attribution` directly
    and writes via `AngleStorage.write()`.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    closed_positions: list[dict]
  outputs:
  - column: angle_data
    type: dict
    description: PnL attribution results with confidence intervals
- id: regime_analysis
  title: Regime Analysis
  purpose: 4-regime classifier (bull/bear/high_vol/sideways), transition matrix, per-regime
    Sharpe ratio
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  - 1W
  - 1M
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: shock_clustering
  title: Shock Clustering
  purpose: 'Identifies which watchlist peers tend to shock together with this symbol:
    co-shock rate (did the peer also register its own shock within +/-1 trading day)
    plus shock-day Pearson correlation with a bootstrapped 95% CI, computed only on
    the anchor''s own shock-date subset -- not a generic, unconditional correlation
    (that redundant, less rigorous version was dropped; see compute.py''s module docstring
    for the corrected-bug history). peer_relative_strength (angle 21) already covers
    general rolling correlation between watchlist peers.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Shock cluster membership for the symbol
- id: shock_personality
  title: Shock Personality
  purpose: 'Post-shock behavioral characterization — gap_fill_rate, vol_persistence
    (real GARCH, vinu_tools.compute.risk.volatility), drift_persistence_days (sign-streak)
    and drift_mean_autocorr (mean lag-1-9 return autocorrelation, previously computed
    and discarded, now reported), each also split by news presence (has_news/nearest_news_days,
    previously computed and discarded, now surfaced per-shock). Every field includes
    sample size and confidence interval.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Shock personality results with confidence intervals
- id: tft
  title: TFT Temporal Fusion Transformer (Quantile Forecast)
  purpose: 'Trained-from-scratch, lightweight Temporal Fusion Transformer (method
    22 of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/22-tft.md)
    — a gated variable-selection network weights engineered return/volatility features
    at each time step, an LSTM encodes the sequence, self-attention pools it, and
    three linear heads produce P10/P50/P90 next-step return quantiles trained jointly
    via pinball loss, per the spec''s "natively quantile forecasts" output format.
    Known-future inputs and static covariates from the source spec are not modeled
    (no such data available from `bars`/`news`); see compute.py''s docstring for the
    full note.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'P10/P50/P90 next-step return and price quantile forecasts, thresholded
      direction from the median, the last-step variable-selection weights per feature,
      and the fit''s training-window count and final training loss.

      '
- id: timer_timerxl
  title: Timer / Timer-XL Patch-Based Foundation Model
  purpose: 'Patch-based forecast using the real Timer pretrained model (method 15
    of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/15-timer-timerxl.md)
    — THUML''s `thuml/timer-base-84m` (84M params), a decoder-only causal transformer
    pretrained on 260B time points, patch length 96. Weights are downloaded into the
    shared models dir (`make models`). Falls back to an honestly-labeled patch-based
    statistical proxy (per-patch mean log-return trend extrapolation) only if the
    weights or load are unavailable at runtime. See compute.py''s module docstring
    for the full explanation. (Corrected 2026-08 — this file previously read "(fallback
    proxy)" and claimed no installable package existed, both stale since the 2026-08-06
    models-wiring pass; found and fixed during angle 27''s implementation, matching
    the same correction already applied to kronos''s spec.yaml.)

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Point forecast for the next 5 periods (the real model''s native
      output) plus a post-hoc p10/p90 residual-normal band (not native model uncertainty),
      checkpoint/patch_size/n_patches, model_backend ("pretrained" in the normal case,
      "fallback_proxy" only if real inference fails at runtime) and fallback_reason.

      '
- id: timesfm
  title: TimesFM Time-Series Foundation Model
  purpose: 'Zero-shot point + quantile forecast from Google''s TimesFM foundation
    model (method 11 of the 32-method plan, see New-talk-/Final-implementation/01-present-considerations/11-timesfm.md).
    General-purpose, not finance-specific — a comparison baseline alongside Chronos
    and Kronos, not a first-choice signal.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'Point forecast plus all 9 real decile levels (q10 through q90 —
      the model''s own trained quantile-head output, genuine model confidence, not
      a bolted-on statistical band) for the next 5 periods, plus context_length_used,
      model_backend ("pretrained" via google/timesfm-2.5-200m-pytorch, or "fallback_proxy"
      if the real checkpoint could not be loaded) and fallback_reason.

      '
- id: tips_regime_aware_transformer
  title: TIPS Regime-Aware Transformer Forecast
  purpose: 'Trained-from-scratch regime-aware transformer (method 24 of the 32-method
    plan, see New-talk-/Final-implementation/01-present-considerations/24-tips-regime-aware-transformer.md)
    — detects the current regime (momentum vs. mean-reversion, via trailing lag-1
    return autocorrelation) and synthesizes a regime-tuned inductive prior by routing
    a shared transformer encoder''s pooled representation through one of two regime-specific
    linear output heads. Produces a one-step point forecast conditioned on, and an
    auxiliary label for, the detected regime.

    '
  time_formats:
  - 1min
  - 5min
  - 15min
  - 1H
  - 4H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: 'One-step-ahead forecast price/return, thresholded direction (up/down/flat),
      detected regime label (momentum/mean_reversion) and its underlying autocorrelation
      statistic, the regime mix seen during training, and the fit''s training-window
      count and final training loss.

      '
