  time_formats:
  - 15min
  - 1H
  - 1D
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: event_study_methodology
  title: Event Study Methodology
