angles:
- id: backtesting_44_metrics
  title: Backtesting Metrics
  purpose: Compute 44+ portfolio metrics — Sharpe, Sortino, MaxDD, WinRate, CAGR,
    VaR, CVaR, tail ratio
  time_formats:
  - 1D
  - 1W
  - 1M
  - 6M
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: benchmark_comparison
  title: Benchmark Comparison
  purpose: Alpha, beta, tracking error, information ratio, up/down capture vs benchmark
  time_formats:
  - 1D
  - 1W
  - 1M
  inputs:
    symbol: str
    from_ts: int | None
    to_ts: int | None
  outputs:
  - column: angle_data
    type: dict
    description: Angle-specific results
- id: decay_monitoring
  title: Decay Monitoring
