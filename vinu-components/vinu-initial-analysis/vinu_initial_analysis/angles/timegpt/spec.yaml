title: TimeGPT (fallback proxy — paid hosted API, no key available)
purpose: >
  Point + interval forecast in the spirit of Nixtla's TimeGPT (method 12
  of the 32-method plan, see
  New-talk-/Final-implementation/01-present-considerations/12-timegpt.md).
  TimeGPT is a paid hosted API with no self-hostable checkpoint, per the
  spec's own text — this angle always runs an honestly-labeled statistical
  fallback proxy (EWMA trend + residual-normal interval) instead of
  calling Nixtla's paid API with no key.
time_formats:
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    Point forecast plus an 80% interval for the next 5 periods, plus
    model_backend (always "fallback_proxy" for this angle) and
    fallback_reason explaining why.
