title: Bidirectional Cross-Attention + GCN News-Price Fusion
purpose: >
  News+price fusion via real bidirectional cross-attention (method 29,
  see New-talk-/Final-implementation/01-present-considerations/
  29-cross-attention-gcn-news-price-fusion.md). The cross-attention layer
  is a genuine small PyTorch module; the GCN's cross-stock layer is
  structurally degenerate here (single-node self-loop) since compute()
  is called per single symbol, not jointly across tickers — see
  compute.py's module docstring and the gcn_note output field.
time_formats:
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    Predicted next-period return/close from the fused price+news
    representation, plus model_backend ("trained_in_process"), gcn_note
    explaining the single-ticker degeneration, and n_news_articles_used.
