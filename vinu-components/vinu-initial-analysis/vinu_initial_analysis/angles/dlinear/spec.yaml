title: DLinear Decomposition Linear Forecast
purpose: >
  Trained-from-scratch DLinear model (method 18 of the 32-method plan, see
  New-talk-/Final-implementation/01-present-considerations/18-dlinear.md) —
  the simplest of six architectures the source survey found "actually win
  on finance". Decomposes the close-price window into a moving-average
  trend and a seasonal residual, fits one small linear layer to each on a
  handful of Adam epochs at request time, and sums their outputs into a
  one-step-ahead point forecast, thresholded to a direction.
time_formats:
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    One-step-ahead forecast price/return, thresholded direction (up/down/flat),
    and the fit's training-window count and final training loss.
