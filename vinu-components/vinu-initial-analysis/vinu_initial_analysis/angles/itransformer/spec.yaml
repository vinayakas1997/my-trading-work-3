title: iTransformer Cross-Variate Attention Forecast
purpose: >
  Trained-from-scratch iTransformer model (method 21 of the 32-method plan,
  see New-talk-/Final-implementation/01-present-considerations/21-itransformer.md)
  — tokenizes variates (here: this symbol's OHLCV channels, since the
  per-symbol compute() interface has no sibling-ticker input to exploit
  true cross-asset attention; see compute.py's docstring for the full
  deviation note) rather than time steps, so self-attention runs across
  variate-tokens. Fit via a handful of Adam epochs at request time;
  reports the close-channel one-step forecast, thresholded to a direction.
time_formats:
- 1min
- 5min
- 15min
- 1H
- 4H
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    One-step-ahead forecast for every OHLCV channel used as a variate
    (forecast_open/high/low/close/volume), close-channel return
    thresholded to a direction (up/down/flat), which channels were used,
    and the fit's training-window count and final training loss.
