title: FinCast Financial Foundation Model (fallback proxy)
purpose: >
  Next-K-line forecast in the spirit of FinCast (method 30, see
  New-talk-/Final-implementation/01-present-considerations/
  30-fincast-foundation-model.md). The spec itself flags FinCast's public
  availability as unconfirmed/borderline (no PyPI package, no
  self-hostable checkpoint reference) — this angle uses an
  honestly-labeled small in-process-trained PyTorch MLP proxy instead of
  hunting for a nonexistent package. See compute.py's module docstring.
time_formats:
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    Predicted next-bar OHLC plus model_backend (always "fallback_proxy")
    and fallback_reason explaining why.
