title: MOMENT Multi-Task Time-Series Foundation Model (fallback proxy)
purpose: >
  Forecast in the spirit of MOMENT's forecasting task (method 14 of the
  32-method plan, see
  New-talk-/Final-implementation/01-present-considerations/14-moment.md).
  The real `momentfm` package failed to build in this Python 3.12
  environment (pkgutil.ImpImporter incompatibility, confirmed via an
  actual install attempt) — this angle uses an honestly-labeled
  statistical fallback proxy for the forecasting task only. See
  compute.py's module docstring.
time_formats:
- 1min
- 5min
- 15min
- 1H
- 4H
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    Point + p10/p90 forecast for the next 5 periods, plus model_backend
    (always "fallback_proxy"), fallback_reason, and task_note flagging
    that only the forecasting task is implemented.
