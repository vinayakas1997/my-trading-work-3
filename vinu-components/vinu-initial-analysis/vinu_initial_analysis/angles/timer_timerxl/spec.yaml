title: Timer / Timer-XL Patch-Based Foundation Model (fallback proxy)
purpose: >
  Patch-based forecast in the spirit of Timer/Timer-XL (method 15 of the
  32-method plan, see
  New-talk-/Final-implementation/01-present-considerations/15-timer-timerxl.md).
  Neither package name exists on PyPI and the only public artifact
  (THUML's research repo) isn't pip-installable — this angle uses an
  honestly-labeled patch-based statistical proxy. See compute.py's module
  docstring.
time_formats:
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    Point + p10/p90 forecast for the next 5 periods derived from
    per-patch trend extrapolation, plus model_backend (always
    "fallback_proxy") and fallback_reason.
