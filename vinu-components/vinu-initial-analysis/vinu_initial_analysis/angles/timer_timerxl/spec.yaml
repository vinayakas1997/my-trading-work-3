title: Timer / Timer-XL Patch-Based Foundation Model
purpose: >
  Patch-based forecast using the real Timer pretrained model (method 15 of
  the 32-method plan, see
  New-talk-/Final-implementation/01-present-considerations/15-timer-timerxl.md)
  — THUML's `thuml/timer-base-84m` (84M params), a decoder-only causal
  transformer pretrained on 260B time points, patch length 96. Weights are
  downloaded into the shared models dir (`make models`). Falls back to an
  honestly-labeled patch-based statistical proxy (per-patch mean log-return
  trend extrapolation) only if the weights or load are unavailable at
  runtime. See compute.py's module docstring for the full explanation.
  (Corrected 2026-08 — this file previously read "(fallback proxy)" and
  claimed no installable package existed, both stale since the 2026-08-06
  models-wiring pass; found and fixed during angle 27's implementation,
  matching the same correction already applied to kronos's spec.yaml.)
time_formats:
- 1min
- 5min
- 15min
- 1H
- 4H
- 1D
inputs:
  symbol: str
  from_ts: int | None
  to_ts: int | None
outputs:
- column: angle_data
  type: dict
  description: >
    Point forecast for the next 5 periods (the real model's native output)
    plus a post-hoc p10/p90 residual-normal band (not native model
    uncertainty), checkpoint/patch_size/n_patches, model_backend
    ("pretrained" in the normal case, "fallback_proxy" only if real
    inference fails at runtime) and fallback_reason.
