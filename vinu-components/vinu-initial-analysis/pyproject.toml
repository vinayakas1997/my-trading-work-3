[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-initial-analysis"
version = "0.2.0"
description = "Foundational analysis pipeline — 25 deterministic angles for every stock"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "cachetools>=5.3",
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vinu-initial-analysis = "vinu_initial_analysis.cli:main"
vinu-initial-serve = "vinu_initial_analysis.cli:serve_main"
vinu-initial-compute = "vinu_initial_analysis.cli:compute_main"
vinu-initial-compact = "vinu_initial_analysis.cli:compact_main"
vinu-initial-query = "vinu_initial_analysis.cli:query_main"

# backward-compat aliases
vinu-correlation-serve = "vinu_initial_analysis.cli:serve_main"
vinu-correlation-compute = "vinu_initial_analysis.cli:compute_main"
vinu-correlation-compact = "vinu_initial_analysis.cli:compact_main"
vinu-correlation-query = "vinu_initial_analysis.cli:query_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_initial_analysis*"]

[tool.setuptools.package-data]
vinu_initial_analysis = ["**/*.yaml", "**/*.sql", "server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
