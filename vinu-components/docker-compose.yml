services:
  # =========================================================================
  # vinu-news (Port: 8080) — API + ingest worker
  # =========================================================================
  news-api:
    build:
      context: .
      dockerfile: vinu-news/Dockerfile
    env_file: .env
    environment:
      VINU_MODELS_DIR: /models
    secrets:
      - alpaca_api_key
      - alpaca_api_secret
      - fmp_api_key
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/news:/data
      - ./data/shared:/shared
      - ./data/models:/models:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/news/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # vinu-stock-price (Port: 8081) — API + ingest worker
  # =========================================================================
  stock-api:
    build:
      context: .
      dockerfile: vinu-stock-price/Dockerfile
    env_file: .env
    secrets:
      - alpaca_api_key
      - alpaca_api_secret
      - polygon_api_key
      - tushare_token
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/stock-price:/data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/stock/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # vinu-tools (Port: 8082) — API + feature worker
  # =========================================================================
  features-api:
    build:
      context: .
      dockerfile: vinu-tools/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/features:/data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/features/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-initial-analysis (Port: 8083) — API + compute worker
  # =========================================================================
  initial-analysis-api:
    build:
      context: .
      dockerfile: vinu-initial-analysis/Dockerfile
    env_file: .env
    environment:
      VINU_MODELS_DIR: /models
      HF_HOME: /home/app/.cache/huggingface
      # Triton (torch 2.13 CUDA kernels) JIT-compiles a .so and must mmap it;
      # the default /tmp tmpfs is noexec here, so give it a dedicated
      # executable tmpfs (see tmpfs: /triton-cache).
      TRITON_CACHE_DIR: /triton-cache
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./data/initial-analysis:/data
      - ./data/models:/models:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
      - /triton-cache:rw,exec,relatime
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/analysis/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      news-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-quant-core (Port: 8084) — merged vinu-strategy + vinu-simulator
  # (Group 1 fold, component-consolidation-plan.md). Both confirmed
  # genuinely stateless -- no background worker, pure request/response
  # APIs -- the lowest-risk fold in that plan. Real paths unchanged
  # (/strategy/*, /simulator/*); only the host:port both now share
  # changed, from two ports to one -- see vinu_strategy/server/merged_app.py
  # and .env/.env-example's VINU_STRATEGY_API_URL/VINU_SIMULATOR_API_URL.
  # =========================================================================
  quant-core-api:
    build:
      context: .
      dockerfile: vinu-quant-core/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - ./data/strategy:/data/strategy
      - ./data/simulator:/data/simulator
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/strategy/health', timeout=3); urllib.request.urlopen('http://localhost:8084/simulator/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      features-api:
        condition: service_healthy
      initial-analysis-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-portfolio (Port: 8090) — API + drawdown monitor
  # =========================================================================
  portfolio-api:
    build:
      context: .
      dockerfile: vinu-portfolio/Dockerfile
    env_file: .env
    secrets:
      - vinu_api_key
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data/portfolio:/data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/portfolio/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      quant-core-api:
        condition: service_healthy
      research-api:
        condition: service_healthy

  # =========================================================================
  # vinu-research (Port: 8087) — API + decay scan
  # =========================================================================
  research-api:
    build:
      context: .
      dockerfile: vinu-research/Dockerfile
    env_file: .env
    secrets:
      - vinu_llm_api_key
    ports:
      - "127.0.0.1:8087:8087"
    volumes:
      - ./data/research:/data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/research/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      features-api:
        condition: service_healthy
      quant-core-api:
        condition: service_healthy
      initial-analysis-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-live (Port: 8091) — API + live worker
  # =========================================================================
  live-api:
    build:
      context: .
      dockerfile: vinu-live/Dockerfile
    env_file: .env
    secrets:
      - vinu_api_key
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data/live:/data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/live/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      portfolio-api:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-agent (Port: 8086)
  # =========================================================================
  agent-api:
    build:
      context: .
      dockerfile: vinu-agent/Dockerfile
    # No `command:` override -- Dockerfile now uses ENTRYPOINT (entrypoint.sh,
    # Phase 9 scheduler-wiring) to also start the skill-audit-worker
    # background loop, same pattern as live-api below. A `command:` here
    # would just be appended as unused args after the entrypoint script.
    env_file: .env
    secrets:
      - vinu_api_key
      - alpaca_api_key
      - alpaca_api_secret
      - vinu_llm_api_key
      - telegram_token
      - discord_token
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - ./data/agent:/data
      - ./vinu-agent/skills:/app/vinu-agent/skills:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/agent/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      stock-api:
        condition: service_healthy
      features-api:
        condition: service_healthy
      news-api:
        condition: service_healthy
      initial-analysis-api:
        condition: service_healthy
      quant-core-api:
        condition: service_healthy
      research-api:
        condition: service_healthy

# =========================================================================
# Secrets (implementation-plan task 13)
# -------------------------------------------------------------------------
# Real credentials are mounted as files under ./secrets/ (gitignored) and
# read by the services from /run/secrets/<name> via vinu_infra.secrets_loader
# -- NOT from plain-text .env. An EMPTY secret file falls back to the legacy
# env var, so `scripts/setup-secrets.sh` (which populates these from your
# existing .env or by prompting) must be run before `docker compose up`.
# =========================================================================
secrets:
  vinu_api_key:
    file: ./secrets/vinu_api_key
  alpaca_api_key:
    file: ./secrets/alpaca_api_key
  alpaca_api_secret:
    file: ./secrets/alpaca_api_secret
  polygon_api_key:
    file: ./secrets/polygon_api_key
  fmp_api_key:
    file: ./secrets/fmp_api_key
  tushare_token:
    file: ./secrets/tushare_token
  vinu_llm_api_key:
    file: ./secrets/vinu_llm_api_key
  telegram_token:
    file: ./secrets/telegram_token
  discord_token:
    file: ./secrets/discord_token
