services:
  # =========================================================================
  # vinu-news (Port: 8080) — API + ingest worker
  # =========================================================================
  news-api:
    build:
      context: .
      dockerfile: vinu-news/Dockerfile
    env_file: .env
    environment:
      VINU_MODELS_DIR: /models
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/news:/data
      - ./data/shared:/shared
      - ./data/models:/models:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/news/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # vinu-stock-price (Port: 8081) — API + ingest worker
  # =========================================================================
  stock-api:
    build:
      context: .
      dockerfile: vinu-stock-price/Dockerfile
