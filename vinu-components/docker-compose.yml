    volumes:
      - ./data/stock-price:/data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/stock/health', timeout=3)"]
