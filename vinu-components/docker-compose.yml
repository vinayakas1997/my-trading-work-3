services:
  # =========================================================================
  # vinu-news (Port: 8080) — API + ingest worker
  # =========================================================================
  news-api:
    build:
      context: .
      dockerfile: vinu-news/Dockerfile
    env_file: .env
    environment:
      VINU_MODELS_DIR: /models
    secrets:
      - alpaca_api_key
      - alpaca_api_secret
      - fmp_api_key
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/news:/data
      - ./data/shared:/shared
      - ./data/models:/models:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/news/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # vinu-stock-price (Port: 8081) — API + ingest worker
  # =========================================================================
  stock-api:
    build:
      context: .
      dockerfile: vinu-stock-price/Dockerfile
    env_file: .env
    secrets:
      - alpaca_api_key
      - alpaca_api_secret
      - polygon_api_key
      - tushare_token
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/stock-price:/data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/stock/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # vinu-screener (Port: 8095) — API (rule CRUD, dry-run, pairlist) + scan loop
  # =========================================================================
  screener-api:
    build:
      context: .
      dockerfile: vinu-screener/Dockerfile
    env_file: .env
    secrets:
      - vinu_api_key
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - ./data/screener:/data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-tools (Port: 8082) — API + feature worker
  # =========================================================================
  features-api:
    build:
      context: .
      dockerfile: vinu-tools/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/features:/data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/features/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-initial-analysis (Port: 8083) — API + compute worker
  # =========================================================================
  initial-analysis-api:
    build:
      context: .
      dockerfile: vinu-initial-analysis/Dockerfile
    env_file: .env
    environment:
      VINU_MODELS_DIR: /models
      HF_HOME: /home/app/.cache/huggingface
      # Triton (torch 2.13 CUDA kernels) JIT-compiles a .so and must mmap it;
      # the default /tmp tmpfs is noexec here, so give it a dedicated
      # executable tmpfs (see tmpfs: /triton-cache).
      TRITON_CACHE_DIR: /triton-cache
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./data/initial-analysis:/data
      - ./data/models:/models:ro
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
      - /triton-cache:rw,exec,relatime
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/analysis/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      news-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-quant-core (Port: 8084) — merged vinu-strategy + vinu-simulator
  # (Group 1 fold, component-consolidation-plan.md). Both confirmed
  # genuinely stateless -- no background worker, pure request/response
  # APIs -- the lowest-risk fold in that plan. Real paths unchanged
  # (/strategy/*, /simulator/*); only the host:port both now share
  # changed, from two ports to one -- see vinu_strategy/server/merged_app.py
  # and .env/.env-example's VINU_STRATEGY_API_URL/VINU_SIMULATOR_API_URL.
  # =========================================================================
  quant-core-api:
    build:
      context: .
      dockerfile: vinu-quant-core/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - ./data/strategy:/data/strategy
      - ./data/simulator:/data/simulator
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 4
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/strategy/health', timeout=3); urllib.request.urlopen('http://localhost:8084/simulator/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      features-api:
        condition: service_healthy
      initial-analysis-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-portfolio (Port: 8090) — API + drawdown monitor
  # =========================================================================
  portfolio-api:
    build:
      context: .
      dockerfile: vinu-portfolio/Dockerfile
    env_file: .env
    environment:
      # Read the SAME shared strategy store the agent writes (stage-7
      # risk-parity weights need the real ACTIVE + PEND batch; see research-api
      # for why this is unified).
      VINU_RESEARCH_DATA_ROOT: /research-data
    secrets:
      - vinu_api_key
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data/portfolio:/data
      - ./data/research:/research-data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/portfolio/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      quant-core-api:
        condition: service_healthy
      research-api:
        condition: service_healthy

  # =========================================================================
  # vinu-research (Port: 8087) — API + decay scan
  # =========================================================================
  research-api:
    build:
      context: .
      dockerfile: vinu-research/Dockerfile
    env_file: .env
    environment:
      # Single shared strategy store: agent (stages 1->7, in-process writes
      # BENCHING/PEND/ACTIVE) and portfolio (stage-7 weights) resolve their
      # VINU_RESEARCH_DATA_ROOT to this same host dir, so live-api's
      # shadow/monitor workers (stages 8->9, which reach it over research-api
      # HTTP) see the very same artifacts the agent promoted. /data stays
      # the research service's own root for everything else.
      VINU_RESEARCH_DATA_ROOT: /research-data
    secrets:
      - vinu_llm_api_key
    ports:
      - "127.0.0.1:8087:8087"
    volumes:
      - ./data/research:/data
      - ./data/research:/research-data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/research/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      features-api:
        condition: service_healthy
      quant-core-api:
        condition: service_healthy
      initial-analysis-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-live (Port: 8091) — API + live worker
  # =========================================================================
  live-api:
    build:
      context: .
      dockerfile: vinu-live/Dockerfile
    env_file: .env
    environment:
      # Without this, trade_audit_log.py's DEFAULT_LOG_PATH falls back to
      # $HOME/.vinu/trade_audit_log.jsonl inside the container -- NOT the
      # mounted /data volume -- so the file was silently lost on every
      # container restart/recreate. Found while wiring analysis C
      # (Loss-cause/slippage attribution, vinu-reflection) -- it needs
      # this file to actually persist across cycles to read anything.
      VINU_TRADE_AUDIT_LOG: /data/trade_audit_log.jsonl
    secrets:
      - vinu_api_key
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data/live:/data
      - ./data/shared:/shared
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/live/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      portfolio-api:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      stock-api:
        condition: service_healthy

  # =========================================================================
  # vinu-agent (Port: 8086)
  # =========================================================================
  agent-api:
    build:
      context: .
      dockerfile: vinu-agent/Dockerfile
    # No `command:` override -- Dockerfile now uses ENTRYPOINT (entrypoint.sh,
    # Phase 9 scheduler-wiring) to also start the skill-audit-worker
    # background loop, same pattern as live-api below. A `command:` here
    # would just be appended as unused args after the entrypoint script.
    env_file: .env
    environment:
      # The agent's strategy lifecycle (writer->BENCHING, risk_gatekeeper->PEND,
      # capital_allocator->ACTIVE via research_link.get_strategy_store()) MUST
      # resolve to the same strategy_store.db research-api serves at
      # /research/artifacts (which live-api's shadow->ACTIVE + monitor read).
      # Without this, /data gave each service a private store and a stage-7
      # ACTIVE was invisible to stage 8/9. Agent's own memory/ledger stay on
      # /data (= data/agent); only the research/strategy root is unified here.
      VINU_RESEARCH_DATA_ROOT: /research-data
    secrets:
      - vinu_api_key
      - alpaca_api_key
      - alpaca_api_secret
      - vinu_llm_api_key
      - telegram_token
      - discord_token
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - ./data/agent:/data
      - ./data/research:/research-data
      - ./data/shared:/shared
      - ./vinu-agent/skills:/app/vinu-agent/skills:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
      - /nonexistent:rw,mode=1777,exec
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/agent/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      stock-api:
        condition: service_healthy
      features-api:
        condition: service_healthy
      news-api:
        condition: service_healthy
      initial-analysis-api:
        condition: service_healthy
      quant-core-api:
        condition: service_healthy
      research-api:
        condition: service_healthy

  # =========================================================================
  # vinu-reflection -- the maturity-agentic reflection worker (no HTTP port;
  # a background loop only, per missing-pieces-of-system/maturity-agentic-
  # system/thinking-1/02-decided-pattern/05-to-do.md). Split into its own
  # service rather than living inside vinu-agent (2026-09-19 update to
  # to-do.md #5) -- kept easy to merge back later since it only ever reads
  # vinu-agent's storage classes in-process, same as research_link.py.
  # =========================================================================
  reflection-worker:
    build:
      context: .
      dockerfile: vinu-reflection/Dockerfile
    env_file: .env
    environment:
      VINU_LIVE_TRADE_AUDIT_LOG: /live-data/trade_audit_log.jsonl
      # Real bug found 2026-09-19: angle_trust.py/debate_value.py/
      # process_mining.py (all built earlier in this same pass) already
      # call vinu-agent's research_link.get_strategy_store(), which
      # resolves VINU_RESEARCH_DATA_ROOT from THIS container's own
      # environment -- unset here until now, so it was silently
      # defaulting to Path.cwd()/data (empty inside the container) and
      # every one of those analysts would read/write nothing in a real
      # deployment. Same variable + mount agent-api already sets for the
      # identical reason.
      VINU_RESEARCH_DATA_ROOT: /research-data
      VINU_SCREENER_DATA_ROOT: /screener-data
      VINU_REFLECTION_PORTFOLIO_DATA_ROOT: /portfolio-data
    volumes:
      - ./data/reflection:/data
      - ./data/agent:/agent-data:ro
      - ./data/live:/live-data:ro
      - ./data/research:/research-data:ro
      - ./data/screener:/screener-data:ro
      - ./data/portfolio:/portfolio-data:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
      - /nonexistent:rw,mode=1777,exec
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      agent-api:
        condition: service_healthy
      live-api:
        condition: service_healthy
      research-api:
        condition: service_healthy
      screener-api:
        condition: service_healthy
      portfolio-api:
        condition: service_healthy

# =========================================================================
# Secrets (implementation-plan task 13)
# -------------------------------------------------------------------------
# Real credentials are mounted as files under ./secrets/ (gitignored) and
# read by the services from /run/secrets/<name> via vinu_infra.secrets_loader
# -- NOT from plain-text .env. An EMPTY secret file falls back to the legacy
# env var, so `scripts/setup-secrets.sh` (which populates these from your
# existing .env or by prompting) must be run before `docker compose up`.
# =========================================================================
secrets:
  vinu_api_key:
    file: ./secrets/vinu_api_key
  alpaca_api_key:
    file: ./secrets/alpaca_api_key
  alpaca_api_secret:
    file: ./secrets/alpaca_api_secret
  polygon_api_key:
    file: ./secrets/polygon_api_key
  fmp_api_key:
    file: ./secrets/fmp_api_key
  tushare_token:
    file: ./secrets/tushare_token
  vinu_llm_api_key:
    file: ./secrets/vinu_llm_api_key
  telegram_token:
    file: ./secrets/telegram_token
  discord_token:
    file: ./secrets/discord_token
