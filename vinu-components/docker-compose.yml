      dockerfile: vinu-tools/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/features:/data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/features/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      stock-api:
        condition: service_healthy

  # =========================================================================
