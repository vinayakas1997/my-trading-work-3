[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-portfolio"
version = "0.1.0"
description = "Portfolio construction service — allocates capital across active strategies with risk-parity, drawdown monitoring, and position sizing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyarrow>=15.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "vinu-research",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vinu-portfolio = "vinu_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_portfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
