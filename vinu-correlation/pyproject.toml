[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinu-correlation"
version = "0.1.0"
description = "Statistical bridge between vinu-news and vinu-stock-price — mathematical proof of news impact on price movements"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "cachetools>=5.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vinu-correlation-serve = "vinu_correlation.cli:serve_main"
vinu-correlation-compute = "vinu_correlation.cli:compute_main"
vinu-correlation-compact = "vinu_correlation.cli:compact_main"
vinu-correlation-query = "vinu_correlation.cli:query_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinu_correlation*"]

[tool.setuptools.package-data]
vinu_correlation = ["**/*.yaml", "**/*.sql", "server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
